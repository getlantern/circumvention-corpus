defense_implications:
    - Circumvention transports that route through DoH/3 gain meaningful size-obfuscation for free from EDNS(0) padding; adopting DoH/3 as an inner-tunnel framing neutralizes the most common passive-classifier attack surface.
    - Tool designers should not assume that size-homogenizing padding prevents fingerprinting — adversaries will pivot to timing features, so complementary inter-packet interval jitter is still required.
