summary: Initiator-disjoint evaluation—where flows sharing the same initiating host are kept entirely on one side of the train-test split—reduces Macro-F1 by 31.4–55.1 points on ISCXVPN and by 23–24 points on USTC-TFC relative to Flow-Random splits across LinearSVC, YaTC, and NetMamba. The gap is larger on ISCXVPN because that dataset has stronger per-host label associations.
