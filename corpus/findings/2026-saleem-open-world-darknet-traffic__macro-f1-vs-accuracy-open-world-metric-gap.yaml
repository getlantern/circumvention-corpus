defense_implications:
    - Circumvention tool red-teaming should target Macro-F1 rather than Accuracy when benchmarking against traffic classifiers — high Accuracy can mask the complete failure to detect novel transport protocols if they are absorbed into existing service categories.
    - New protocol designs should be evaluated against leave-one-service-out classifiers, not closed-world baselines, to realistically estimate evasion durability.
