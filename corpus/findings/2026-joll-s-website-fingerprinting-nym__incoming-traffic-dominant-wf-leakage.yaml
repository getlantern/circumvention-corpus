defense_implications:
    - Circumvention proxies that tunnel web traffic through a mixnet must rate-limit or pad incoming responses from the open internet, not just outgoing requests — raw response bursts leak site identity even through a mixing layer.
    - The latency cost of server-side Poisson shaping (up to 12× overhead) suggests constant-rate tunneling (POISS-OFF) or burst-mimicry (WTF4Nym) are preferable architectural choices over naive inter-arrival rate limiting.
