summary: Raw UDP P2P gaming traffic was detected and blocked within 1–2 hours. Hysteria 2 port-hopping delayed blocking but the entire server IP was eventually blacklisted once enough ports were consumed. The reporter identified udp2raw + WireGuard (with udpspeeder for packet loss compensation) as the most stable high-performance solution.
