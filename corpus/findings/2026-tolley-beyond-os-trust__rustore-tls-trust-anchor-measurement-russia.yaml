defense_implications:
    - Circumvention tools targeting Russian users cannot treat the Android OS trust store as a security boundary; implement certificate pinning or SPKI pinning against known server keys to resist app-level CA injection.
    - Monitor RuStore and similar Russian domestic distribution channels for CA certificate distribution patterns that may silently expand the MITM surface for Russian Android users.
