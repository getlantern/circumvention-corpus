defense_implications:
    - Russia's whitelist-based model (only approved services run during restriction states) means IP-space-based defenses (domain fronting via CDNs, decoy routing) are at risk of collateral blocking if the CDN or ISP is not on the whitelist; circumvention tools should evaluate whether their cover traffic host is whitelisted in target regions.
    - Platform-side VPN detection (websites blocking VPN exit IPs) is now a parallel enforcement layer distinct from the network censor; tools need exit-node strategies that do not use well-known datacenter IP ranges detectable by commercial VPN-block lists.
