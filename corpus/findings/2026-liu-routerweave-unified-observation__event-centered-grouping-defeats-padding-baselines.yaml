paper: 2026-liu-routerweave-unified-observation
kind: detection
summary: RouterWeave's task-adaptive event-centered observation units achieve 94.20% event F1 for intermittent IoT-style operations, compared with 65.74–72.92% for fixed sliding windows and 72.56–74.54% for traffic-triggered gap-based grouping—a gain of 19.66 percentage points over the best conventional baseline. The improvement comes from a packet-membership neural network that isolates operation-related bursts from background traffic, allowing temporally separated exchanges belonging to the same event to contribute to a single observation even when unrelated packets arrive between them.
