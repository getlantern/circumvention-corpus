defense_implications:
    - Port-hopping alone is insufficient when the censor tracks and aggregates ports to an IP; pair port rotation with IP rotation or traffic camouflage to prevent whole-IP blacklisting
    - udp2raw (TCP-camouflaged UDP tunnel) provides meaningful longevity over raw UDP for latency-sensitive use cases; consider integrating a similar shim layer
