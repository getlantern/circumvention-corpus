defense_implications:
    - Use authenticated typed frames (DATA/DUMMY/FIN) inside an inner FEP rather than relying on length-only shaping — this prevents cross-direction semantic leakage while keeping wire bytes indistinguishable from uniform random.
    - Separate the private close-readiness event from the public close time by continuing full scheduled output through the next permitted close bucket (quantized close), so connection teardown carries no timing signal.
