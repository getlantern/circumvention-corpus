summary: Under the history-only causal interface, NetGuise achieves 3.02% bandwidth overhead and 1.16 ms/flow generation latency, versus the next-best query-free baseline (BAP) at 19.80% bandwidth overhead and 37.42 ms/flow — a 6.6× reduction in padding and a 32.3× speedup. This is achieved without runtime classifier queries by amortizing morphing into a reusable offline-trained Transformer model that executes as a single forward pass.
