defense_implications:
    - When designing subscription update mechanisms, ensure the update format supports incremental rule injection rather than full replacement — full replacement breaks user customizations on every subscription refresh.
    - Provide a JavaScript scripting API (analogous to Clash Verge's Script mechanism) so power users can programmatically prepend rules without risking clobber from subscription updates.
