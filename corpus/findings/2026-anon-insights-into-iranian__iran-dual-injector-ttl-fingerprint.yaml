defense_implications:
    - Two independent injector infrastructures with different TTL signatures mean a circumvention probe that succeeds when one injector is offline may fail when both are active — test resilience against both TTL clusters, not just one.
    - The transient absence of one injector (NTL1 on June 11) represents a narrow evasion window; however, this is likely maintenance-driven and unpredictable, so it should not be relied upon as a circumvention strategy.
