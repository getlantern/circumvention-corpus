summary: Time-based attributes are reviewed as a primary feature family for encrypted traffic classification, complementing packet header features. The chapter explicitly cites the Draper-Gil et al. (2016) work showing that time-related features characterize encrypted and VPN traffic, and the Alshammari & Zincir-Heywood (2011) result demonstrating that encrypted traffic can be identified without port numbers, IP addresses, or payload inspection using only flow statistics.
