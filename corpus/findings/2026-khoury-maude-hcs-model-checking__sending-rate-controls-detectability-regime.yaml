defense_implications:
    - Embed explicit timing controls (configurable inter-message delays, jitter, rate caps) into HCS designs as a primary undetectability lever — traffic-rate shaping is a more accessible countermeasure than structural protocol changes.
    - Provide operators with a pacing configuration parameter tied to a published privacy-performance curve so they can select an operating point appropriate to their threat model and bandwidth requirements.
