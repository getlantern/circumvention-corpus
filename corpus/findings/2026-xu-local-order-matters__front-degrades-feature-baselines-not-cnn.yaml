summary: 'FRONT padding causes catastrophic accuracy degradation for direction-only feature-based WF attacks: k-FP-style RF falls from 92.3% to 38.5% (−53.8 pp), Wang-kNN-style from 88.8% to 30.7% (−58.1 pp), and CUMUL-RF from 89.6% to 25.0% (−64.6 pp). The CNN drops only from 94.1% to 54.2% (−39.9 pp), demonstrating that count- and volume-based features are far more vulnerable to dummy-cell injection than sequence-aware learned representations.'
