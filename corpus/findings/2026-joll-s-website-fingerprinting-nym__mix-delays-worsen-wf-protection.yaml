paper: 2026-joll-s-website-fingerprinting-nym
kind: detection
summary: Increasing mix delays in Nym counterintuitively worsens website fingerprinting protection. Without cover traffic, raising λM from 0 ms to 100 ms increases Transposition feature leakage from ~40% to 95.5% and N-gram leakage to 78.1%, because larger delays create a visible temporal gap between outgoing request bursts and incoming response bursts at the adversary's observation point, making per-site traffic patterns more consistent across captures.
