defense_implications:
    - Social- and congestion-aware heuristics can improve delivery efficiency in shutdown-scenario mesh networks without additional bandwidth cost — adopt them as a baseline over naive flooding.
    - Routing through fewer intermediate carriers reduces man-in-the-middle attack surface (black hole attacks, Harvest Now Decrypt Later), which is critical when carrying sensitive protest communications.
