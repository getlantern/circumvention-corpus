summary: On FRONT-defended traffic, truncating the CNN input from 5000 to 2000 cells drops accuracy from 54.6% to 41.7%; at L=1000 it falls to 27.6%, below the k-FP-style RF baseline of 38.5%. The defended-traffic win depends on the model observing enough of the trace to recover surviving local ordering, so defenses that limit observable trace length can significantly degrade CNN-based WF accuracy.
