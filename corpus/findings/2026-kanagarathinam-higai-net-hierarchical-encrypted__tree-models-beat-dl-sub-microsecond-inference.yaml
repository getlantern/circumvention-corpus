summary: Gradient-boosted tree models (LightGBM, XGBoost, Random Forest) outperform all deep-learning variants—including FlowTransformer and LSTM—by 4–7 pp at L2 and L3 on a 44,492-flow dataset. HDP attention weights show 83% and 74% concentrated on the engineered-statistics branch at L2 and L3 respectively, confirming that DL/UL byte ratios and IAT variance carry the discriminative signal and transformer layers add cost without proportional accuracy return. With a per-flow hash-table cache, amortized inference drops below 1 µs per packet.
