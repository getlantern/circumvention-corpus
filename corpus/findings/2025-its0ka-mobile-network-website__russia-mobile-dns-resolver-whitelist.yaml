defense_implications:
    - Circumvention tools bootstrapping in Russia should not rely on 1.1.1.1 or 9.9.9.9 as fallback resolvers; only ISP-assigned DNS and 8.8.8.8 were reachable in the tested environment.
    - Consider encoding bootstrap server addresses directly in the client rather than relying on DNS lookups to non-whitelisted resolvers.
