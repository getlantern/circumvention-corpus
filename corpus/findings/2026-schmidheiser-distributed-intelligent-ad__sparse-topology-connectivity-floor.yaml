defense_implications:
    - For sparse protest formations or geographically dispersed activist networks, mesh routing protocols hit a hard connectivity floor independent of algorithm quality — supplementary strategies (longer communication range, multi-channel radio, store-and-forward with longer TTL) are required.
    - Strongly socially-connected relay nodes (high betweenness centrality) are disproportionately valuable in sparse topologies; protocol design should weight their selection more heavily when spatial density is detected to be low.
