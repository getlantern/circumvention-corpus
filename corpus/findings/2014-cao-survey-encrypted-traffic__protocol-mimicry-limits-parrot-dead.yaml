summary: Protocol mimicry defenses (SkypeMorph, StegoTorus, obfsproxy, FTE) were the dominant circumvention strategy as of 2014, but the 'Parrot is Dead' analysis (Houmansadr et al., IEEE S&P 2013) and 'Peek-a-boo' (Dyer et al., IEEE S&P 2012) showed that naive mimicry fails because classifiers can distinguish imperfect imitations at flow level.
