abstract: Iran experienced a near-complete internet shutdown from June 17-26, 2025, with selective IP-based whitelisting (api.github.com, api.google.com accessible; ASes 44244 IranCell and 57218 RighTel nearly unreachable per IODA measurements). Community members tested circumvention approaches including MTProto proxies, v2ray tunnels (VLESS/VMESS), and Tor bridges with Snowflake and obfs4 in real-time, finding mixed success as the censor actively detected and blocked circumvention proxies.
