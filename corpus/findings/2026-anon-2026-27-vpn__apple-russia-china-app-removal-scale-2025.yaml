summary: Apple's 2025 App Store Transparency Report disclosed that 2,045 apps were removed globally due to government takedown requests, with Russia accounting for 1,213 removals and China mainland for 196. Russia's count increased dramatically from 171 in 2024, 12 in 2023, and 7 in 2022 — a roughly 7× year-over-year increase — while Access Now reported that 2025 saw at least 313 internet shutdowns across 52 countries, the highest number recorded since tracking began in 2016.
