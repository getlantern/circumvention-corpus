summary: In the first 10 days of April 2026, Telegram availability in Russia without VPN dropped to 5%, while an estimated 40%+ of Russian users rely on VPNs. From mid-April, 20+ Russian domestic platforms including Gosuslugi, Ozon, Wildberries, Yandex, Sberbank, and VK began restricting access to users detected as using VPNs.
