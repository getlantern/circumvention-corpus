defense_implications:
    - Wrapping traffic in a protocol layer that fully conceals application-level byte patterns — as Tor relay cells do — degrades ML classifier Macro-F1 from ~84% to ~26%; full nested encapsulation is a high-value architectural defense against self-supervised classifiers.
    - Circumvention tools that expose visible TLS handshake metadata should consider whether that metadata is application-identifiable; Tor-style full encapsulation with no plaintext application fields is significantly more classifier-resistant than direct TLS tunneling.
