paper: 2026-anon-anytls-protocol-guide-how
kind: defense
summary: 'AnyTLS multiplexes logical streams over reusable TLS sessions: before opening a new TLS session the client checks an idle-session pool, reuses the entry with the highest sequence number, and returns healthy sessions to the pool after each stream. Default sing-box parameters are idle_session_check_interval=30s, idle_session_timeout=30s, and min_idle_session=0. The paper notes that keeping 5–10 idle sessions ''is not a universal best practice'' because it increases open connections and server resources without guaranteed latency benefit.'
