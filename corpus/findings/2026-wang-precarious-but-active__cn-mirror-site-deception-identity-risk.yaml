defense_implications:
    - When a platform is blocked, the vacuum is filled by unvetted mirrors that create new identity-exposure risks; circumvention tools should consider bundling canonical domain verification (e.g., certificate pinning or signed mirror lists) to protect users from phishing infrastructure that exploits blocking.
    - Users in censored environments have limited ability to verify platform authenticity — tool designers should treat mirror-site deception as a first-order threat model, not an edge case.
