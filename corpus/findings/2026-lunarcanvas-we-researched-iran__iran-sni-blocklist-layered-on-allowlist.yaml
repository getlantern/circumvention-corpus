defense_implications:
    - Use Encrypted ClientHello (ECH) or domain fronting so the SNI presented to the Iranian DPI layer does not reveal the actual destination; a benign or absent SNI passes without interference.
    - Since filtering is a named-domain blocklist rather than generic TLS inspection, protocols that rotate to unlisted or synthetic domain names (e.g., REALITY's server-name forwarding, domain-fronting via CDN) can bypass SNI filtering even for allowlisted IPs.
