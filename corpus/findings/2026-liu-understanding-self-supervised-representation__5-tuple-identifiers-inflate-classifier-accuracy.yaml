defense_implications:
    - Censors correlating 5-tuple metadata with traffic patterns can achieve near-90% classifier accuracy without any deep learning; circumvention tools cannot rely on protocol obfuscation alone and must also obscure the IP/port identity of proxy endpoints.
    - Routing through shared CDN or domain-fronting infrastructure where 5-tuples are not application-exclusive is a necessary complement to payload-level obfuscation, since identifier leakage alone enables high-confidence classification.
