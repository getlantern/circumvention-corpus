abstract: Community report documenting IP-based whitelisting enforcement on Russian mobile networks (Beeline, Tele2) in certain regions. Users observed non-whitelisted IPs completely inaccessible, DNS queries to non-whitelisted resolvers blocked, and TLS ClientHello packets dropped to non-whitelisted destinations. Attempted circumvention via SNI spoofing and stunnel tunneling achieved temporary success before being blocked, indicating centralized TSPU-level enforcement.
