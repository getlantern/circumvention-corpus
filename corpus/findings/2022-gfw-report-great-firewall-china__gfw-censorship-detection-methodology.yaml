summary: 'Two empirically-validated methods for independently detecting GFW censorship are documented: (1) Send a DNS query to a non-DNS server outside China — any DNS response received is necessarily forged by the GFW; (2) Send a TLS ClientHello with the target SNI to an open port of a server outside China — a TCP RST (openssl errno=104) indicates likely SNI censorship. Both methods require a control domain (e.g., baidu.com) to rule out false positives.'
