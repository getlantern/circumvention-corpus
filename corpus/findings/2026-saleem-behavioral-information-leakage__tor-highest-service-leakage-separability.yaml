summary: Tor exhibits the highest service separability among the four evaluated anonymity networks, achieving a Macro-F1 of 0.7165 and a cumulative normalized behavioral leakage of 3.9461 under combined structural–rhythmic classification. FreeNet exhibits the lowest combined leakage (0.8744) and the lowest intra-network Macro-F1 (0.4510). The primary leakage drivers in Tor are directional byte-exchange asymmetry (S_byte_directional_dominance, normalized MI = 0.258) and byte tempo (R_byte_tempo, normalized MI = 0.198).
