defense_implications:
    - EDNS(0) padding alone cannot be relied upon as a privacy defense for DNS-over-HTTPS traffic; circumvention tools that use DoH/3 as a covert channel must add timing obfuscation on top of standard padding.
    - Open-world detection precision of 0.906 at recall 1.0 means passive observers can reliably flag all monitored destinations with manageable false positives — DoH/3 tunnels should not be considered low-profile even against mid-capability adversaries.
