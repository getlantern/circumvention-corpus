defense_implications:
    - Prioritize reducing guard-relay churn (e.g., bandwidth-bar hysteresis for guard-flag assignment) over minimizing version-exclusion events — churn is the dominant anonymity threat, not version enforcement.
    - Relay-based circumvention networks should invest in guard-selection stability mechanisms to limit repeated path reassignment, which is what actually exposes clients to persistent adversarial ASes.
