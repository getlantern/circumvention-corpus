defense_implications:
    - Target-conditioned morphing (aligning blocked traffic to the packet-size and timing distribution of a specific allowed class) is significantly more resilient to censor retraining than generic noise injection; circumvention tools should morph toward a concrete permitted-traffic archetype rather than just disrupting classification.
    - Diminishing censor returns in adaptive arms races suggest that high-diversity morphing strategies force the censor to over-tighten decision boundaries, increasing false positives on legitimate traffic — a collateral-damage lever that benefits circumvention tool designers.
