defense_implications:
    - ECH circumvention strategies must account for browsers that send GREASE ECH extensions rather than real ECH — GREASE exposes the outer SNI and provides no censorship-resistance benefit despite appearing ECH-aware.
    - Tools that depend on ECH for SNI hiding should prompt users to update browsers to at least Firefox/139 or Chrome/137, where real ECH success rates climb above 55–83%.
