summary: Iran→Cloudflare WebSocket connections without ECH failed for all tested variants immediately after the TLS handshake, consistent with SNI-based filtering. With ECH enabled, connections succeeded at 44–48 MB/s down and up to 82 MB/s up across 4 sessions (RTT 109–116 ms vs. CDN base 86 ms), demonstrating ECH as a high-throughput bypass for SNI-blocking on Cloudflare.
