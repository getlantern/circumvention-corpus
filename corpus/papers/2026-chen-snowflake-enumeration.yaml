notes: |
  Direct empirical attack on Snowflake's two core security assumptions
  (proxy IPs can't be enumerated cheaply; blocking proxy ASNs is too
  costly for the censor). A malicious-client attacker enumerated 21k+
  proxy IPs over 48 days and found that blocking just the top 1% of
  observed ASNs would knock out 30%+ of observed Snowflakes for ~0%
  collateral damage on the Tranco Top 100. Also shows the broker's
  load-aware proxy matching leaks which proxies are high-capacity/stable
  early, worst during high-demand events like the Iran June 2025
  shutdown — an adaptive-attacker side-channel worth understanding for
  any Lantern bridge-distribution or matching design that shares this
  "match clients to the best available proxy" shape. Authors say some
  mitigations are already integrated into Snowflake; worth checking
  which, and whether lantern-box's own proxy-distribution/matching logic
  has the analogous exposure.
