summary: No prior system combines post-quantum key encapsulation, anonymous overlay routing, and real-time voice on consumer embedded hardware. Signal and Wire rely on centralized infrastructure and classical cryptography, exposing call metadata and IP addresses to the service provider; Briar and Cwtch route exclusively over Tor hidden services but support only text messaging and lack post-quantum key encapsulation; PQXDH and related academic post-quantum messaging work targets asynchronous text, not real-time audio.
