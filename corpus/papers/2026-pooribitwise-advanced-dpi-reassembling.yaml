abstract: A user in Iran reports aggressive blocking of VLESS + WebSocket traffic proxied through Cloudflare CDN. Despite deploying TCP fragmentation (10-30 byte chunks with inter-packet delays of 10-20ms) and rotating through clean Cloudflare IPs, domains are blocked within 24 hours via DNS hijacking (queries resolving to 10.10.34.34) and RST floods when accessing the Cloudflare IP with the specific SNI. Additional circumvention protocols including Reality, WireGuard, and SSH dynamic forwarding are also rapidly blocked (within 8 hours for SSH), indicating the Iranian DPI has been upgraded to perform stateful TCP reassembly and SNI extraction on-the-fly, defeating traditional fragmentation-based obfuscation.
