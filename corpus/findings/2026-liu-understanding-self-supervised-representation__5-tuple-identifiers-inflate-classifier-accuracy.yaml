summary: 'Network 5-tuple identifiers (IP addresses, ports) dramatically inflate encrypted traffic classifier accuracy when not masked: retaining these identifiers raises ET-BERT''s Macro-F1 on CSTNET from 60.04% to 85.23% and YaTC''s from 74.42% to 92.92%, because many 5-tuples are application-exclusive and bypass the need to learn protocol semantics.'
