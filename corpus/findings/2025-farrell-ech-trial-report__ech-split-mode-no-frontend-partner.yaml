defense_implications:
    - 'ECH split-mode (the configuration most useful for bypassing IP-level blocking) faces a critical ecosystem gap: CDN/hosting operators are unwilling to serve as the ECH front-end for high-risk back-ends, limiting ECH''s anti-censorship utility to scenarios where the service''s own IPs are not blocked.'
