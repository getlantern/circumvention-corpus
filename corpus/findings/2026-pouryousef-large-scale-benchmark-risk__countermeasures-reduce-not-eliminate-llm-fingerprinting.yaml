defense_implications:
    - Single-feature countermeasures (padding packet sizes, adding timing jitter, or varying temperature alone) are insufficient against multi-family correlated fingerprinting — a circumvention transport must apply coordinated shaping across burst structure, chunk timing, and response volume simultaneously.
    - Semantics-preserving prompt reformulation is a promising application-layer defense but reduces rather than eliminates risk; combining it with network-layer traffic shaping is necessary for strong privacy guarantees.
