defense_implications:
    - Censors or adversaries observing only server-to-client traffic can infer the nature of a user's query (e.g., distinguishing code generation from adversarial prompts) — circumvention tools must also shape outbound streaming response traffic, not just the request.
    - Because leakage comes from decoding behavior rather than content, application-layer padding that normalizes chunk sizes and inter-chunk intervals is necessary to suppress prompt-category inference.
