defense_implications:
    - Near-zero WF leakage (F1≈0.06) is achievable in mixnets via constant-rate traffic but the 7.32× latency overhead makes it viable only for high-risk, latency-tolerant use cases (e.g., bulk file transfer over Tor-like circuits).
    - Circumvention system designers should expose both a moderate-overhead burst mode (F1≈0.39) for interactive browsing and a constant-traffic mode for users with elevated threat models, rather than committing to a single overhead tier.
