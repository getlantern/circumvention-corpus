summary: In low-density protest formations where nodes are often 10 metres apart or more (blockade 2 mobility model), no tested protocol achieved 100% message delivery, and buffer occupancy plateaued well before maximum capacity — indicating that the delivery ceiling is determined by spatial connectivity, not routing sophistication or buffer size. Dynamic clique routing required an average of 727 hops to reach 90% of recipients in this pattern, 33% more than IDCR's 547.
