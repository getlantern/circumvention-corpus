defense_implications:
    - Fragmentation or padding below 1001 bytes may have bypassed the Period B broad filter; any QUIC-based transport should test whether sub-MTU fragmentation avoids the version-header detection heuristic.
    - TSPU residual censorship persists 420 seconds on the 4-tuple and resets on each new packet; circumvention tools must anticipate that triggering detection locks the 4-tuple and should rotate ports or IPs accordingly.
