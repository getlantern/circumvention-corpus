summary: The GFW deployed SNI-based blocking on google.com and all *.google.com on September 22, 2022 (between 6:23 AM and 7:33 PM Beijing Time), then added DNS-based blocking eight days later on September 30, 2022 (between 1:56 PM and 2:35 PM Beijing Time). All 1,147 tested *.google.com domains were blocked without exception under the wildcard rule.
