defense_implications:
    - Multi-platform circumvention deployments (mobile + desktop clients) cannot assume that OS or platform diversity obscures usage patterns—traffic fingerprints generalize across Android, iOS, and Windows in ways that require active countermeasures on each platform independently
    - A single ISP-side observation point is sufficient for cross-platform application classification; circumvention designs should not rely on distributing traffic across multiple devices to confuse per-device fingerprinting models
