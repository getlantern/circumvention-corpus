paper: 2026-pouryousef-large-scale-benchmark-risk
kind: detection
summary: Using only LLM-to-user response packets (22 features), a classifier identifies the semantic category of a user's prompt — among six classes including code generation, mathematical reasoning, and adversarial requests — with 67.37% mean accuracy versus a 16.67% random baseline. Response-only accuracy exceeds full-traffic accuracy (65.10%), and packet-size and timing features contribute the most unique information (8.34 pp and 7.26 pp drop when each is removed); the leakage originates from generation behavior, not prompt length.
