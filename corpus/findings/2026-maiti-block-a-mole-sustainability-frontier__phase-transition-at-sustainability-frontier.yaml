defense_implications:
    - Design for β < 0.65 (8-domain buffer) rather than for rotation speed; once µ/λa ≥ 1, the address layer is saturated and further speed gains provide no measurable availability benefit.
    - Size domain buffers generously — kmax = 32 pushes β* toward 1.0, a direct lever that no amount of endpoint rotation speed can replicate.
