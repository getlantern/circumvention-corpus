defense_implications:
    - When modeling censor-side ML detection, use endpoint-level (destination-grouped) base rates rather than flow-level rates; a censor or SOC blocking by destination operates in the ~4% positive-rate regime, not the 55% figure typical of published results.
    - Circumvention protocol evaluations should report metrics at both flow and endpoint/session granularity to surface unit-of-analysis artifacts before drawing conclusions about detectability.
