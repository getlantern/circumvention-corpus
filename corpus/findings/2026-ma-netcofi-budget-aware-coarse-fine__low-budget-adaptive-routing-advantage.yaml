summary: 'Under low-budget adaptive routing (ρ=0.3, using ~30% of tokens), NetCoFi outperforms a same-depth static 120-byte input baseline by an average of 7.86 Macro-F1 percentage points across three datasets: 3.89 pp on ISCXVPN2016, 5.26 pp on CTU-13, and 14.42 pp on CSTNET-TLS1.3.'
