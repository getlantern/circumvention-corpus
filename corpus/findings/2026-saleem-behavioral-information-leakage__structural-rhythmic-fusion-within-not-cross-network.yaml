defense_implications:
    - A censor deploying a joint structural-rhythmic classifier has strong within-network performance but poor cross-network generalization — circumvention designs that route traffic through novel or under-studied networks gain a meaningful classifier blindspot that persists even against fusion models.
    - Transport obfuscation that independently attacks structural (padding) and rhythmic (timing jitter) channels provides no compounding synergy benefit to the censor, confirming that addressing both channels in isolation is the correct threat model.
