summary: The GFW examines TLS ClientHello SNI values and, when a match is found against the blacklist, immediately injects forged TCP RST packets to tear down the connection. SNI-based censorship of google.com and *.google.com began on September 22, 2022 (between 6:23 AM–7:33 PM Beijing Time), blocking all 1,147 tested *.google.com domains without exception.
