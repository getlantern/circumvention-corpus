defense_implications:
    - Fine-grained traffic classification requires sustained observation; circumvention transports that limit session duration or use many short connections reduce the censor's observation window and degrade classifier accuracy.
    - Traffic multiplexing (combining multiple logical streams over one encrypted tunnel) makes fine-grained service-level classification harder by mixing signal from different traffic classes.
