summary: In the pre-shutdown scan (Scan 2), Iran's QUIC censorship jumped from 1 domain (0.01%) to 9,000 domains (100%) via complete UDP Initial-packet drops, while DNS-over-TCP censorship spiked from 15.12% to 96.68% of 9,000 queried domains. Both changes preceded the full blackout by roughly 5 days, indicating they were preparatory measures rather than incidental. After the shutdown lifted, QUIC remained 100% blocked while DNS-over-TCP returned to baseline (15.38%).
