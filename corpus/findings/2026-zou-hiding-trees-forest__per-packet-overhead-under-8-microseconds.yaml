defense_implications:
    - SHA-256-based carrier filtering is viable in high-speed network environments without causing packet-processing bottlenecks; the sub-8 µs overhead can be further reduced by substituting lightweight hash algorithms (e.g., BLAKE3) if latency is critical.
    - The overhead is payload-size-dependent but not filter-key-size-dependent — choose any L≥6 without per-packet latency penalty, making the covertness–capacity tradeoff purely a bandwidth design decision.
