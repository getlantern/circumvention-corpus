summary: An encrypted proxy (Shadowsocks, Trojan, VMess) protects only the client-to-server segment; traffic from the proxy server to a non-HTTPS destination may be readable on the onward path. Applications not covered by system-proxy, TUN, or routing rules connect directly, bypassing the tunnel entirely.
