defense_implications:
    - Rotating server IPv6 addresses frequently (exploiting the large address space) can suppress realized entropy for adversary fingerprints and is a low-cost server-side mitigation; the paper's churn analysis shows that ~35% of churning IPv6 domains already rotate within an hour.
    - Fingerprint databases need periodic DNS re-resolution to remain effective; this creates a practical window for defenses that aggressively rotate addresses faster than censor refresh cycles.
