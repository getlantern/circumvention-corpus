paper: 2025-lu-rpki-based-location-unaware-tor
kind: evaluation
summary: Shadow simulation at 10% Tor scale (719 relays, 75,234 clients) shows the Matching Selection algorithm adds 5.3% latency to circuit build time and 2.4% to round-trip time versus vanilla Tor; average overall transfer time is 1.8 seconds slower (out of 12 seconds baseline). For 100MB transfers—which occur rarely given the probability distribution of transfer sizes—the matching algorithm is 6.5 seconds slower on average and 15 seconds slower at median versus vanilla Tor's 31-second average.
