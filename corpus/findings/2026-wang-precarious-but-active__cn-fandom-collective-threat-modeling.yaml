paper: 2026-wang-precarious-but-active
kind: evaluation
summary: 'Contrary to an apathetic response to surveillance, fans actively constructed collective ''red lines'' — community-shared threat models distinguishing definitely dangerous activities from acceptable gray-area behaviors. This community-level threat modeling was shaped by real incidents (e.g., the 2024–2025 Haitang author arrests) and operated in tension with privacy solutions: individual circumvention (e.g., accessing AO3 via VPN) did not restore community function because the broader fandom remained trapped on domestic platforms.'
