    - 'Circumvention tools should treat HOWLR-style detection as a necessary but insufficient layer: a determined nation-state adversary with traffic-forwarding capability can preserve witness consistency and evade detection, so complementary signals (latency anomalies, path-length changes) should also be monitored.'
