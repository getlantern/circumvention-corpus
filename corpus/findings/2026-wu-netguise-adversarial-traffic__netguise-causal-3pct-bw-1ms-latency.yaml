defense_implications:
    - Offline-trained target-conditioned morphers (optimize once, deploy many times) are viable for production pluggable transports — sub-2 ms per-flow overhead is compatible with real-time proxy use and does not require classifier access at the censor's endpoint.
    - Traffic-shaping overhead below 5% bandwidth expansion makes adaptive morphing deployable without triggering bandwidth-usage anomalies; designs that exceed 20% padding are detectable on their overhead signature alone.
