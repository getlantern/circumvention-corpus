defense_implications:
    - Protocols that rely on the TLS SNI field for routing or identity must assume SNI is inspected and acted upon by the GFW; any circumvention transport must either encrypt or omit the SNI.
    - DNS resolution of proxy server hostnames cannot be trusted inside China; circumvention tools should distribute server IPs out-of-band or use DoH/DoT over trusted channels rather than relying on the system resolver.
