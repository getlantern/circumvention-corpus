summary: 'Address blocking is a provably losing censor strategy: single-endpoint address-denial probability is p_ip = λ_a/(λ_a+µ), and with n independent endpoints it decays geometrically as (λ_a/(λ_a+µ))^n. Simulation confirms that with µ/λ_a=1 (discovery as fast as rotation), 7 endpoints drive address-denial below 10^-2; even when discovery is twice as fast as rotation (µ/λ_a=0.5), modest redundancy keeps denial small. The censor''s collateral budget γ further caps address blocking, leaving domains as the only rational blocking target (Proposition 3: empirical censor best-response allocates f*=0.97 of discovery budget to domains once n ≥ 2).'
