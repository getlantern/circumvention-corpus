defense_implications:
    - Deploying ECH today protects roughly two-thirds of real users without availability risk — it is safe to enable in production now rather than waiting for RFC finalization.
    - The non-trivial 36% ECH not-tried rate means ECH alone is insufficient for censorship resistance; a fallback transport is still required for users on older clients.
