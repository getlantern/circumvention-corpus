defense_implications:
    - Published accuracy numbers from packet-level evaluation splits likely overstate real-world censor classifier performance on unseen connections; circumvention researchers should require per-flow splits when benchmarking transport resistance.
    - Real-world classifier generalization to never-before-seen flows remains high (74–94% F1 range across tasks), so circumvention transports cannot rely on distributional shift from new deployments to evade detection for long.
