abstract: Russian mobile operators (tested on Beeline and Tele2) have deployed whitelist restrictions blocking access to non-whitelisted IP addresses and domains, while permitting only specific .gov.ru and commercial services (Yandex.ru, VK). Connections to non-whitelisted addresses fail at the TLS ClientHello stage and non-whitelisted traffic is throttled to ~64 bytes per request, rendering it unusable. The filtering appears to be centrally enforced via TSPU across multiple carriers, with temporary circumvention using stunnel-based tunneling recently patched.
