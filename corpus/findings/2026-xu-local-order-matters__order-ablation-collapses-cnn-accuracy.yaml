defense_implications:
    - An effective WF defense must randomize the temporal ordering of real Tor cells — not just inject dummy cells — to defeat convolutional classifiers; FRONT-style front-padding leaves the real-cell ordering largely intact and exploitable.
    - Cover-traffic designs should aim to make the joint distribution of cell directions and their relative positions indistinguishable across sites, since position-invariant count features alone are insufficient for a CNN-class attacker.
