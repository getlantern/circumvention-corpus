summary: The Loyalsoldier rule set uses an 86400-second (24-hour) refresh interval via jsDelivr CDN URLs, with 11 rule set files spanning domain behavior (reject, iCloud, Apple, Google, proxy, direct, private), IP CIDR behavior (Telegram CIDRs, China CN CIDRs, LAN CIDRs), and classical/application-level behavior (P2P applications). Rule set download success is contingent on client ability to reach the CDN URL — the interval setting is not proof of successful update.
