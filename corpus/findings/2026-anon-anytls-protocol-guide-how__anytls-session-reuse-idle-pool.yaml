defense_implications:
    - Measure cold-start latency and burst concurrency on the target path before tuning idle-session counts; the default of zero pre-warmed sessions is the safe baseline and avoids conspicuous persistent connection counts.
    - Implement idle-session eviction with a monotonically increasing sequence preference so stale long-lived TLS sessions (which may be fingerprinted by session age) are retired before fresh ones.
