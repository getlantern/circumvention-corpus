summary: 'Even for source IPs permitted by Iran''s allowlist, a TLS ClientHello containing a sensitive SNI triggers a TCP RST with 97.4% consistency across three repetitions. The filtering operates as a domain-specific blocklist: 49.9% of hrw.org and 50.2% of tiktok.com requests were reset, while only 0.5% of youtube.com requests were blocked, and randomly generated non-existent domain names passed without interference.'
