defense_implications:
    - Circumvention tools targeting Iran must tunnel over ICMP for transport; TCP/UDP-based transports (WireGuard, OpenVPN, standard QUIC/H3, obfs4, Shadowsocks) are unusable on affected routes without an ICMP carrier.
    - Probes should dynamically test transport availability and fall back to ICMP-based channels when TCP/UDP fail, since the blocking may vary by route or AS.
