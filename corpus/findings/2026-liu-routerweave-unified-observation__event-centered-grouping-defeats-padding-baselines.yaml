defense_implications:
    - Blending circumvention traffic with realistic background traffic (heartbeats, telemetry, CDN polling) degrades event-centered classifiers more than adding bulk padding, because operation-onset detectors rely on burst isolation—injecting synthetic background-like packets around sensitive exchanges makes membership assignment harder
    - Fixed inter-packet timing jitter is insufficient; circumvention transports need variable-burst injection strategies that make event boundaries indistinguishable from ambient home-network noise
