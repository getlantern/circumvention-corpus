summary: 'Behavioral leakage is concentrated in a small subset of flow-level descriptors rather than uniformly distributed across the feature space. Globally, S_payload_per_packet (normalized MI = 0.173) and R_silence_density (normalized MI = 0.132) are the dominant leakage sources. No descriptor dominates across all networks: I2P leaks primarily through S_forward_packet_share (MI = 0.069) and R_burst_frequency_proxy (MI = 0.056), while FreeNet and ZeroNet rely on R_packet_tempo (MI = 0.066 and 0.101 respectively).'
