summary: A client-agnostic Discount Selection algorithm—discounting consensus weights of non-ROA-covered guard relays by factor d—achieves 90.2% of clients selecting ROA-protected guards at d=0.5 and 80% network load, an 18.8% improvement over vanilla Tor, with no measurable performance difference in Shadow simulation even at 100MB transfer sizes.
