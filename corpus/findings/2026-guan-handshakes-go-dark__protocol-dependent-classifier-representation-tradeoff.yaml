summary: On weakly encrypted malware traffic (USTC-TFC, 98.9% unencrypted), byte-based DeepPacket outperforms sequence-based FS-Net by 7.02% in accuracy; but on strongly encrypted website traffic (CSTNET-TLS 1.3), sequence-based FS-Net outperforms byte-based DeepPacket by 17.71%, confirming that optimal traffic classification strategy is protocol-dependent and no single representation generalizes across both encrypted and unencrypted traffic.
