abstract: A user reports that enabling TUN mode with VLESS+REALITY proxy configuration on Russian mobile ISP Beeline (AS16345) causes systemic connection degradation after 5–15 minutes, restricting access to only the government MAX messenger service. The phenomenon occurs system-wide across devices, is specific to Windows TUN mode (not occurring on Android or with system proxy), and is consistently reproducible. Commenters hypothesize DNS anomalies or connection-pattern detection as the DPI-level vector.
