defense_implications:
    - Use DNS-over-HTTPS or DNS-over-TLS resolved entirely outside China to bypass GFW DNS injection; plaintext UDP/53 queries traversing the Chinese border are subject to forged responses regardless of the resolver specified.
    - Account for per-injector heterogeneity when building detection or monitoring tools — inconsistent blocking across GFW injectors means a single measurement point may give a false-negative.
