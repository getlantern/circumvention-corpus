summary: Yiyan Wang, a PhD student at the University of Colorado Boulder studying internet censorship under Eric Wustrow, disappeared in July 2024 after returning to China. As of June 2026—nearly two years later—his whereabouts remain unknown and he is unreachable through all normal channels. Human Rights in China (HRIC) issued a formal statement in June 2026 calling on the Chinese government to disclose his status.
