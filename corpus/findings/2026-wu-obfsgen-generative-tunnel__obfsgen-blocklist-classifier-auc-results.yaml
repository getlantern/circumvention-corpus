defense_implications:
    - Schedule-driven obfuscation trained on a local reference corpus provides strong resistance to known-tunnel classifiers; deploying obfsgen-style transports would significantly raise the censor's false-negative rate.
    - Evaluate circumvention tools at operationally realistic false-positive rates (e.g., 0.6% as used in this paper), not just AUC, since nation-state censors face high collateral-damage costs for false positives.
