summary: Machine-learning classifiers applied to flow-level features (packet sizes, inter-arrival times, byte counts, flow duration) can identify encrypted application protocols including SSH and Skype without inspecting payload content. Supervised and unsupervised approaches reported in the survey demonstrate that encrypted traffic classification is practically feasible using only transport-layer metadata.
