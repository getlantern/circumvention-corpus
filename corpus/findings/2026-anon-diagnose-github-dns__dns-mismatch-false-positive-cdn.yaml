defense_implications:
    - Automated censorship-detection tools that flag DNS mismatches as poisoning will generate false positives against CDN-distributed services; corroborate with a reachability probe to the returned address before concluding interference.
    - Circumvention apps reporting DNS status to users should distinguish 'returned unexpected address that also fails to connect' from 'returned different-but-valid CDN address' to avoid alarming users unnecessarily.
