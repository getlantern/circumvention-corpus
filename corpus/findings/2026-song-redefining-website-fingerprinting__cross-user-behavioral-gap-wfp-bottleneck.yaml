defense_implications:
    - User behavioral heterogeneity (variation in scroll depth, dwell time, interaction style) functions as natural WFP obfuscation; circumvention proxies that amplify per-user traffic variance — rather than imposing uniform padding — exploit this structural attacker weakness.
    - Defenses should prioritize maximizing inter-user traffic diversity (e.g., by randomizing padding schedules per session) over deterministic shaping, to exploit the cross-user generalization gap that persists even in LLM-enhanced classifiers.
