defense_implications:
    - Abandon TCP fragmentation as a primary SNI-hiding technique against Iranian DPI — stateful reassembly now nullifies it; shift to protocols that structurally eliminate plaintext SNI (ECH/ESNI, domain-fronting with opaque inner SNI, or fully encrypted transports)
    - If using Cloudflare CDN as a front, assume the real SNI is extractable by the censor; combine CDN fronting with ECH or a non-SNI-bearing transport layer
