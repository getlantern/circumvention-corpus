defense_implications:
    - Windows TUN stacks (WinTun/Wintun-based) produce OS-level traffic signatures (NDIS driver behavior, DNS resolver patterns, IP routing artifacts) that differ from mobile OS TUN or user-space proxying — protocol designers should characterize and mitigate these OS-specific signals.
    - Hotspot propagation of the penalty confirms ISP-level state tied to the upstream connection, not the device; circumvention tools deployed as hotspot gateways face amplified collateral damage risk and should prioritize rapid penalty-state detection and recovery.
