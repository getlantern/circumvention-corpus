summary: HiGAI-Net classifies encrypted GenAI traffic (ChatGPT, Copilot, Gemini) using only packet-header metadata—no payload, no SNI—achieving 98.5% weighted F1 for AI/Non-AI detection (LightGBM, window=20) and 86.4% per-service identification despite TLS 1.3 and ECH. Of 44,492 labeled flows, 38% of Gemini sessions used QUIC with no SNI available, confirming that ECH removes the last passive plaintext signal but header statistics remain.
