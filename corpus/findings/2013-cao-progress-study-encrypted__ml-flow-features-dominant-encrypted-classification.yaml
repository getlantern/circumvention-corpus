summary: By 2012–2013, ML classifiers applied to flow-level statistical features—packet size distributions, inter-arrival times, and byte-count statistics—had become the dominant approach to encrypted traffic classification, superseding port-based and DPI methods. The survey cites over a dozen ML studies covering supervised (SVM, maximum-likelihood) and unsupervised (genetic optimization, hierarchical clustering) methods applied to SSH, Skype, VoIP-over-IPSec, and P2P traffic.
