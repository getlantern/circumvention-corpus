defense_implications:
    - Circumvention traffic carrying video streams is particularly identifiable; stream-based protocols (e.g., video conferencing tunneled over a proxy) need active rate shaping or pacing to suppress the bursty intensity curve characteristic of video.
    - A single obfuscation strategy is unlikely to neutralize both correlation-based and integral-area-based classifiers simultaneously; designers should evaluate both classifier families when testing evasion.
