abstract: A report from Fujian province documenting the operational status of circumvention tools as of August 2026. Most censorship-resistant service providers are non-functional in Fuzhou; v2ray remains partially functional while Tor Browser bridges and Snowflake are blocked. DNS over HTTPS services (NextDNS, Cloudflare) are reported completely unavailable, and P2P applications experience throttling. The report links observations to Geedge Networks' documented "Fujian Project" pilot.
