defense_implications:
    - Designs routing sensitive traffic through Tor onion services cannot assume introduction-circuit anonymity lasts the full 18–24h advertised lifetime — a partial observer with ISP-level access to one relay at a time can deanonymize the service host in ~2h median.
    - Any circumvention tool that piggybacks on Tor's introduction-point mechanism should treat the service's network location as potentially exposed within hours of circuit establishment, not days.
