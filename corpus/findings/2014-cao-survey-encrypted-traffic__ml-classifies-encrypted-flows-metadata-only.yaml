defense_implications:
    - Traffic shaping that only pads packet sizes is insufficient — inter-arrival timing, flow duration, and byte-count distributions must also be normalized to defeat ML classifiers.
    - Circumvention tools should evaluate their flows against published ML classifiers (BLINC, flow-based SSH detectors) before deployment to verify statistical indistinguishability.
