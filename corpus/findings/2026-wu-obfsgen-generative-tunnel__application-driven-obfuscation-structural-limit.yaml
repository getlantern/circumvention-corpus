paper: 2026-wu-obfsgen-generative-tunnel
kind: defense
summary: Application-driven obfuscators (obfs4 and all surveyed deployed transports) can only increase burst size and add delay; they cannot act while the application is idle to reduce tunnel-induced round-trip overhead. Xue et al. found that obfs4's timing obfuscation made the RTT fingerprint worse, not better, confirming that application-driven obfuscation is structurally unable to close distributional gaps where tunneling traffic is already larger or slower than the normal reference.
techniques:
