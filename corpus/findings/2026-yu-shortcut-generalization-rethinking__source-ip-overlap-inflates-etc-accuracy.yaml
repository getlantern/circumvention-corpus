defense_implications:
    - IP rotation and ephemeral source addresses will substantially degrade censor-side ML classifiers that were trained with source-IP leakage; classifiers relying on identity shortcuts lose ~24pp more accuracy than those trained on masked identifiers.
    - When evaluating evasion of a traffic classifier, control Source-IP overlap to 0% in the test partition—otherwise reported evasion success may be inflated by shared-identity shortcuts rather than genuine generalization.
