summary: Encrypted traffic can be classified into audio, video, and data categories using only statistical features (traffic intensity curves, correlation patterns) without inspecting payload content. The paper demonstrates that indirect signs derived from packet-level statistics are sufficient to distinguish application types even when the payload is fully encrypted.
