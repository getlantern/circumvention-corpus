summary: On CSTNET-TLS 1.3, applying Source-IP grouping (keeping all packets from the same source host on one side of the split) reduces Macro-F1 from high baseline performance to 37.58% at L0, after which additional field masking (L1–L3) changes performance only marginally. On ISCXVPN, Parent-flow grouping reduces accuracy from 68.42% to 60.08% between L0 and L3. These dataset-specific interactions show that the effect of identifier masking is inseparable from the cross-partition sharing induced by the grouping rule.
