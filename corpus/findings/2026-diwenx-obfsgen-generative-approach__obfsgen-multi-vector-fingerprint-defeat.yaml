defense_implications:
    - An obfuscation layer that proactively sends cover traffic (even when the application has nothing to send) and suppresses application traffic (holding it in a buffer) is necessary to defeat whole-flow and cross-flow fingerprinting — passive shaping alone cannot achieve this.
    - Evaluate obfuscation designs against all three detection axes simultaneously (traffic shape, TLS handshake, website fingerprinting) rather than optimizing for one; a design that defeats two while leaving the third exploitable still fails in deployment.
