defense_implications:
    - 'Open-world robustness at 97.64% AUROC means that routing circumvention traffic through a large number of cover domains provides limited protection: a sufficiently capable fingerprinter can still isolate monitored from unmonitored sites with high confidence.'
    - Effective defenses must make circumvention traffic indistinguishable from the full distribution of HTTPS traffic at the TLS-record level, not merely blend with a broad set of monitored websites.
