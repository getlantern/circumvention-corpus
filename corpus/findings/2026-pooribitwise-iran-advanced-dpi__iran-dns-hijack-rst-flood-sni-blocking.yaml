defense_implications:
    - DNS-over-HTTPS is insufficient if Iranian DPI can extract SNI from reassembled TLS and independently block at the IP layer; both encrypted DNS and IP-layer rotation are required simultaneously.
    - Domain rotation provides limited protection when the DPI adds new SNIs extracted from live traffic to blocklists within 24 hours; tools should prefer shared CDN IPs not uniquely associated with any single SNI.
