summary: 'Iranian DPI blocking of VLESS+WebSocket traffic manifests via two mechanisms: DNS hijacking redirecting queries to 10.10.34.34 (a known Iranian sinkhole), and RST floods issued immediately when a client connects to a Cloudflare IP using a blocked SNI. Even domains with no prior DNS records and zero prior usage history were blocked, suggesting SNI-based domain extraction at the DPI layer driving proactive blocklist additions.'
