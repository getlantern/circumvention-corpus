summary: 'Per-packet SHA-256 filtering overhead remains below 8 µs across all tested filter key lengths (L=1–8): storage channel packets (average 709 bytes) average 5.70–6.48 µs, and timing channel packets (average 1,146 bytes) average 7.44–7.87 µs. Introducing the filter adds less than 0.01 µs overhead over unfiltered embedding for storage channels.'
defenses:
