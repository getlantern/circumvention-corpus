summary: Since early October 2026, Iranian ISPs have blocked TCP, UDP, GRE, IPIP, SCTP, and ESP from Iran to international destinations, with only ICMP echo reliably passing. Base RTT to Europe is ~40 ms with 0.2–2% random loss independent of load, indicating this is a deliberate protocol-level block rather than congestion.
