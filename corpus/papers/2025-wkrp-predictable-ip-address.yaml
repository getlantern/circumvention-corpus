abstract: Researchers observed that GFW DNS injectors use ordered and cyclic IP address pools when returning false responses to blocked domain queries. Through high-rate probing (100–500 queries per second) with fixed source/destination tuples, complete IP address sequences can be recovered by collecting and reconciling multiple copies of the cyclic pattern with occasional gaps. Reproducible Python tooling (multiquery.py, filter.py, order.py, plot.py) is provided to demonstrate this analysis against blocked domains like torproject.org.
