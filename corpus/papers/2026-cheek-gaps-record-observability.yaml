abstract: 'Comparative analysis of internet shutdown detection comparing IODA''s automated network-level approach (BGP, Active Probing, Telescope, Google Search) against Access Now''s #KeepItOn Shutdown Tracker. Identifies three categories of detection gaps: prolonged conflicts with gradual infrastructure recovery, AS-targeted shutdowns affecting specific ISPs rather than entire countries, and application-layer blocking invisible to network-level measurement. Analysis of 73 unmatched events (2022 onward) reveals that application-layer shutdowns represent a growing blind spot in automated detection systems.'
