paper: 2026-liu-routerweave-unified-observation
kind: evaluation
summary: RouterWeave reconstructs 600 Screen Time activity timelines averaging 19 minutes across Android (91.48%), iOS (88.64%), and Windows (96.55%) from encrypted traffic, achieving 92.15% overall time-weighted accuracy with a 24.84-second mean active-time error (~2.2%). Even under frequent activity switching (10–30-second segments), accuracy remains at 86.10% with 75.29% temporal intersection over union, demonstrating that cross-platform application usage is classifiable from a single router-level vantage point regardless of OS diversity.
