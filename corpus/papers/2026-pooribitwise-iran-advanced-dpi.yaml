abstract: A user reports advanced DPI capabilities in Iran that defeat heavy TCP fragmentation obfuscation. Despite deploying fragmented packets (10–30 bytes) on a VLESS+WebSocket setup behind Cloudflare's CDN, domains are blocked within 24 hours via DNS hijacking (resolving to 10.10.34.34) and RST floods, indicating Iran has deployed stateful TCP reassembly and sophisticated stateful inspection. Other protocols—Reality, WireGuard, SSH—are experiencing rapid blocking, suggesting significant infrastructure upgrade.
