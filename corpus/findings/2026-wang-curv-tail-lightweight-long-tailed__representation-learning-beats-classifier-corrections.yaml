defense_implications:
    - The bottleneck for ML traffic classification lies in feature extraction (packet lengths, inter-arrival times, byte patterns), not the classifier head; circumvention defenses must corrupt these low-level observable features rather than exploiting weaknesses in classifier post-processing pipelines.
    - End-to-end jointly trained classifiers are the correct threat model—frozen pre-trained encoders with corrected classifiers are far weaker, so defenses validated only against pre-trained models underestimate real adversary capability.
