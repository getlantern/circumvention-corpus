defenses:
    - tor
defense_implications:
    - Accept that 70%+ of potential users are Privacy Pragmatists who prioritize convenience over protection; circumvention tools must impose near-zero usability cost to reach beyond the small Fundamentalist minority, or they will remain niche.
    - Prioritize integrations and referrals from existing privacy-tool ecosystems (Tor, Brave, extension stores) to efficiently reach the behaviorally privacy-active population, who are both aware of threats and predisposed to adopt countermeasures.
