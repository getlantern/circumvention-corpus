summary: Standard DPI and port-based classification methods fail against encrypted traffic because payload bytes are opaque and applications increasingly use non-standard or randomized ports. The survey identifies statistical and behavioral flow-level analysis as the primary viable approaches for classifying encrypted traffic, as they operate on metadata observable without decryption.
