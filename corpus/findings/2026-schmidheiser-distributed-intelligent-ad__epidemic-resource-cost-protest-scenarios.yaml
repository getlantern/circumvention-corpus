defense_implications:
    - Flooding-based fallback transports for internet-shutdown scenarios must be rejected in favor of topology-aware protocols — the energy and bandwidth overhead will exhaust devices and collapse the mesh before communication goals are met.
    - Protocol design should target delivery rate parity with Epidemic at a fraction of the resource cost; IDCR demonstrates this is achievable in dense topologies.
