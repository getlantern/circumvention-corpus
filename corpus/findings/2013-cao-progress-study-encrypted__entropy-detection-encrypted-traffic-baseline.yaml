summary: Entropy-based detection of encrypted traffic (Dornger 2010, referenced as the survey's first citation) was an established real-time technique by 2012, enabling censors to flag high-entropy byte streams without any payload parsing. The technique serves as a lightweight first-pass filter before more expensive ML classification stages.
