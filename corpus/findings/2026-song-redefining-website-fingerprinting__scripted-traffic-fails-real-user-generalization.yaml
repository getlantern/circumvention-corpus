defense_implications:
    - Re-evaluate all existing WFP defenses against human-generated behavioral traffic rather than scripted crawlers — published defense results may be validated against a threat model that overstates attacker accuracy by 80+ pp.
    - Behavioral unpredictability (diverse scroll depth, dwell time, dynamic SPA interactions) is a natural form of traffic obfuscation; circumvention tools running inside browsers should exploit this variance rather than suppress it.
