abstract: A September 2025 leak of 100,000+ internal documents from Geedge Networks—a Chinese surveillance-equipment vendor co-founded by Great Firewall architect Fang Binxing—revealed the export of GFW-derived censorship infrastructure to Myanmar, Pakistan, Ethiopia, Kazakhstan, and India. The leaked code and documentation from internal systems (Jira, Confluence, GitLab) were analyzed by InterSecLab, Amnesty International, Justice for Myanmar, and investigative journalists. Evidence indicates deployment in Chinese provinces including Xinjiang, Jiangsu, and Fujian.
