defense_implications:
    - Undetectability claims must be evaluated against a range of adversary detector thresholds, not a single chosen operating point — a protocol that passes one threshold can fail badly under a more conservative one.
    - Protocol designers should publish KL divergence lower bounds as a function of detector configuration, not just pass/fail against a single threshold, to give deployers an honest picture of the privacy envelope.
