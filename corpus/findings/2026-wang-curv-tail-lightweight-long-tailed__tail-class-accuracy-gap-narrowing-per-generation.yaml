defense_implications:
    - The accuracy gap between rare and common traffic classes is narrowing with each generation of classifier (4.97 pp tail gain vs. 0.65 pp head gain over MM4Flow); circumvention protocols that relied on obscurity through rarity are facing rapidly diminishing evasion margins.
    - A circumvention tool's evasion half-life from novel-protocol obscurity is shortening as tail-class accuracy approaches head-class accuracy; active traffic shaping rather than novelty alone must be the primary defense mechanism.
