defense_implications:
    - 'The attack is operationally cheap and long-lived: a censor building an IP fingerprint database once can identify 60%+ of destinations for months without updating it, so defenses cannot rely on temporal decay alone.'
    - Circumvention tools serving long-lived sessions should consider periodic IP rotation on the server side (exploiting IPv6 address space abundance) as a structural defense, targeting the ~35% of IPv6 domains that already rotate sub-hourly naturally.
