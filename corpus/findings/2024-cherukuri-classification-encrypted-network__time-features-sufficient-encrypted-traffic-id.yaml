defense_implications:
    - Inter-packet timing distributions are a stable and independently-sufficient classification signal; circumvention tools must actively reshape timing (e.g., adding jitter, fixed inter-packet delays) to defeat time-feature classifiers.
    - Eliminating payload distinguishability (e.g., via full encryption) is insufficient if flow-timing and volume metadata are preserved; traffic shaping must target the temporal domain explicitly.
