summary: Monte Carlo simulations across four EoL exclusion rounds (2021–2023) show that natural relay churn is the dominant driver of Tor client anonymity loss, with EoL exclusions giving AS and IXP adversaries an advantage equivalent to only ~4 days (AS adversary) or ~9 days (relay adversary) of the network running without exclusion. In the 2021 exclusion event, up to ~1% of additional clients were compromised; by 2023 this figure dropped to ~0.30%, attributed to improved operator update discipline and Tor Project communications.
