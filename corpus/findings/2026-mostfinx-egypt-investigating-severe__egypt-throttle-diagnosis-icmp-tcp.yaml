summary: The key diagnostic question for Egypt's throttling is whether the speed cap is implemented as an account-wide bandwidth limit or as protocol/traffic-specific shaping. A high-rate ICMP echo (ping) test during throttling can distinguish between packet-loss-based throttling (suggesting TCP congestion manipulation) and pure bandwidth shaping, since TCP congestion-based throttling would not affect ICMP the same way.
