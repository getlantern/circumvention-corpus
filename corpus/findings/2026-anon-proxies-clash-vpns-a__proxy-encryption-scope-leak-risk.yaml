defense_implications:
    - Default all application traffic through TUN mode rather than system-proxy to eliminate routing-rule bypass leaks; audit which apps are excluded and document the exposure explicitly in client UI
    - Document encryption scope clearly — proxy ≠ full-device encryption — so users do not assume end-to-end protection for non-HTTPS destinations
