defense_implications:
    - Anonymity tools that mimic semantically related 'benign' traffic categories (e.g., making P2P flows resemble FTP or video flows resemble browsing) may trigger systematic misclassification that persists even under uncertainty-based rejection.
    - 'Designers should target the high-confidence absorption zone: flows shaped to match known-service behavioral profiles will receive near-certain false-positive labels rather than being flagged as anomalous.'
