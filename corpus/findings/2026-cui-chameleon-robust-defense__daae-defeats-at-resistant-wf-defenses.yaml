defense_implications:
    - Do not rely on defenses that apply deterministic or stable traffic transformations; an attacker with access to paired original/defended traces can train an autoencoder to strip the defense pattern.
    - Treat DAAE-resistance as a separate, required evaluation criterion alongside adversarial-training resistance when assessing any traffic-shaping defense.
