defense_implications:
    - ECH server deployment does not require waiting for full client adoption — it is additive and safe to enable now, with privacy benefits accruing incrementally as clients update.
    - Do not rely solely on ECH for SNI privacy at current adoption rates; pair ECH deployment with fallback strategies (e.g., split-mode, domain fronting) for users on non-ECH-capable clients.
