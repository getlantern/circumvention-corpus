paper: 2026-lenders-secrets-best-not
kind: detection
summary: In SCHC header compression, even a compact rule ID (8 bits in the paper's configuration) can function as a persistent flow identifier, leaking the per-device communication pattern to an eavesdropper. Standard per-device SCHC rule assignments allow an adversary to associate rule IDs with individual constrained IoT devices across sessions.
techniques:
    - traffic-shape
    - dpi
defenses:
    - randomization
censors:
    - generic
defense_implications:
    - Assign SCHC rule sets per-peer-pair (using a function of both source and destination addresses, e.g., XOR of link-layer addresses) rather than per-device, so the same rule ID maps to multiple destinations and cannot uniquely identify a device.
    - Exchange SCHC rule sets out-of-band over an encrypted channel (e.g., CORECONF) and rotate them periodically to prevent rule-ID-based long-term tracking.
section: §2 / §6.3
