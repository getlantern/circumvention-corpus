defense_implications:
    - Sub-millisecond per-flow inference at state-of-the-art accuracy with under 1M parameters makes deployment of this classifier feasible at line rate for resource-constrained network operators; circumvention tool designers cannot rely on ML infeasibility as protection.
    - Circumvention defenses must be validated against lightweight end-to-end classifiers trained directly on target data—not only large pre-trained transformer models that require separate pretraining stages and far greater compute.
