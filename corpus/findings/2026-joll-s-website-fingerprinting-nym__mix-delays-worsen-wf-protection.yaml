defense_implications:
    - Do not rely on propagation delays alone (e.g., long mixnet paths) to defeat website fingerprinting; temporal separation of request/response bursts is exploitable and worsens with added latency.
    - Cover traffic injected at the client/gateway endpoint is more effective than in-network mixing delays for WF resistance — prioritize endpoint shaping over routing latency.
