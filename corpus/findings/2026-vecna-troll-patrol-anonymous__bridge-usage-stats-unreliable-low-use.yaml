defense_implications:
    - Do not rely on bridge-side connection count telemetry as the primary signal for censorship detection; connection-count thresholds (e.g., Loesing's threshold of 32) are ineffective for bridges distributed to small user populations.
    - Design bridge health systems to require active verification (scan-based confirmation) rather than inferring censorship from passive usage statistics alone.
