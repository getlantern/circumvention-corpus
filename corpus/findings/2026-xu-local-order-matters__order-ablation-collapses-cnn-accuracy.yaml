paper: 2026-xu-local-order-matters
kind: detection
summary: A controlled order-ablation that permutes only each trace's nonzero traffic prefix while preserving direction counts, retained length, and padding positions collapses WF-CNN accuracy from 54.2% to 7.6% (a 46.6 pp drop), placing it below every implemented feature baseline (k-FP-style RF 38.5%, Wang-kNN-style 30.7%, CUMUL-RF 25.0%). The result shows that the CNN's FRONT advantage depends strongly on order-derived information rather than direction counts or trace length alone.
