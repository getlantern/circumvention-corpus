defense_implications:
    - Circumvention tools designed for censored communities must account for community-level network effects — individual access to unblocked platforms does not constitute a usable solution if the broader community cannot follow, so reducing onboarding friction for non-technical users is as important as the protocol itself.
    - User threat models are actively maintained at the community level and updated in response to enforcement events; circumvention tools should provide timely, in-app communication about detected blocking changes rather than relying on users to self-discover.
