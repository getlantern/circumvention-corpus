censors:
    - ir
defense_implications:
    - Fragmentation-based SNI hiding is no longer a viable evasion technique against Iranian DPI; designs relying on it must migrate to UDP-based transports (e.g., Hysteria2) or protocols that do not expose SNI even after full reassembly.
    - CDN-fronted VLESS/WebSocket must not depend on TCP fragmentation as a primary obfuscation layer; the combination of randomized path and CDN fronting is insufficient against stateful deep reassembly.
