defense_implications:
    - Implement explicit stream-open acknowledgment (analogous to cmdSYNACK) in new proxy protocols so clients detect blocked or stuck destination connections in milliseconds rather than waiting for OS-level TCP timeouts, reducing the censored-path detection window.
    - Version-negotiate session features at handshake time so padding scheme updates can be pushed from server to client without client-side upgrades breaking existing sessions.
