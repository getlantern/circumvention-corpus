summary: Periodically rebuilding only the internal service-side path of the introduction circuit (entry guard → vanguard → middle relay) approximately every 10 minutes — while keeping the publicly advertised Introduction Point fixed — limits evidence accumulation to one rebuild interval without requiring a descriptor update. Under this mitigation the effective circuit lifetime visible to an intersection attacker drops from 18–24h to ~10 min, matching ordinary Tor circuit lifetimes.
