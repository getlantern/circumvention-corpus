defense_implications:
    - Circumvention tools relying on public Tor relays for onion-service infrastructure face a baseline adversary advantage of ~75% geographic overlap with cooperative intelligence jurisdictions — distributing server infrastructure outside Fourteen-Eyes hosting (or using bridges) measurably reduces this exposure.
