summary: 'Combining structural and rhythmic descriptors into a unified S+R representation consistently yields the highest within-network Macro-F1 across all four anonymity networks, providing evidence of complementary information in the two behavioral channels. However, the same fusion does not improve cross-network transferability: S+R performs similarly to or slightly worse than the best individual channel under leave-one-network-out evaluation (e.g., Tor held-out: Combined 0.1175 vs. Rhythmic 0.1822). This asymmetry indicates that structural–rhythmic interactions encode network-architecture-specific rather than universally transferable behavioral information.'
