summary: Iranian DPI infrastructure performs full TCP fragment reassembly and stateful inspection, extracting SNI values even from streams deliberately fragmented into 10–30 byte chunks with 10–20 ms inter-fragment delays. A VLESS+WebSocket setup behind Cloudflare CDN (full-strict mode, randomized path, clean IPs) was blocked within 24 hours despite client-side fragmentation verified by tcpdump. The reporter confirms two domains were blocked even though no DNS record for the root domain was published, indicating proactive or pre-emptive domain enumeration by the censor.
