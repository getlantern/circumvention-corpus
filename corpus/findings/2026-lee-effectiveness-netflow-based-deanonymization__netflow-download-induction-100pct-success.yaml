paper: 2026-lee-effectiveness-netflow-based-deanonymization
kind: detection
summary: The download-inducing attack achieves 100% deanonymization success rate against Tor onion services using only coarse NetFlow telemetry (1-out-of-1,000 sampled packet counts, 1-minute aggregation), correctly identifying the target OoI among 12,041 candidate IP addresses. Pearson correlation coefficients between the adversary-induced and observed target traffic traces range from 0.72–0.98, while non-matching candidates top out at 0.68. A 1-hour attack at 1× background traffic intensity suffices for 100% success in simulation.
