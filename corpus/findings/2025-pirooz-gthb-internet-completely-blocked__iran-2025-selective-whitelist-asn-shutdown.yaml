defense_implications:
    - Circumvention infrastructure should be hosted on IPs and domains that fall within a censor's whitelist surface (CDN endpoints, major API hostnames) to survive selective-whitelist shutdowns.
    - Monitor IODA or equivalent BGP-layer signals per AS—carrier-level blackholing (IranCell AS44244, RighTel AS57218) requires exit-node diversity spanning multiple upstream ASes, not just multiple IPs.
