summary: 'Countermeasures against fingerprinting can paradoxically increase a user''s identifiability when deployed by a small population: spoofing-introduced attribute inconsistencies and unusual configurations (e.g., Tor Browser''s letterboxing applied to an uncommon monitor size) produce a rarer, higher-entropy fingerprint than baseline. This ''information paradox'' means that countermeasure effectiveness is a property of the anonymity set size, not of individual tool configuration.'
