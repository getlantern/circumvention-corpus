defense_implications:
    - Anti-ossification compliance (RFC 8701 GREASE) in deployed middleboxes means TLS CHLO parameter ordering is preserved end-to-end by a majority of enterprise firewalls — circumvention tools can safely encode state or signals in cipher-suite / extension ordering without NGFW normalization breaking it.
    - Even ossifying NGFWs that reorder parameters still preserve which values are present; circumvention protocols can fall back to selection-based signaling (which values appear in TLS CHLO) as a lower-throughput but universally preserved channel.
