defense_implications:
    - Apply cover traffic and rate-smoothing to the incoming (server-to-client) direction, not just the outgoing direction — this is the primary architectural gap in Nym's default design and likely generalizes to any asymmetric tunneling protocol.
    - The server-side relay must implement Poisson-rate or constant-rate padding; client-side cover traffic alone is insufficient when server responses are forwarded in unmodified bursts.
