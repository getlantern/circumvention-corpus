summary: 'Iran''s June 2025 shutdown was enforced using fine-grained, service-level techniques rather than BGP withdrawals or a single ''big switch'' event: individual protocols were selectively blocked before and after the 7-day full blackout (June 18–25), with the total preparation and recovery periods each lasting roughly 4–5 days. Cloudflare Radar showed HTTP traffic reaching near-zero by June 18 but partial recovery already on June 21, while the authors'' vantage point (AS57497) remained unreachable until June 25, confirming heterogeneous recovery across Iranian networks.'
