summary: 'POISS-OFF, a constant-traffic defense that routes all web traffic through Nym''s loop cover capabilities, reduces the Tik-Tok WF attack F1 score to 0.06 — matching near-ideal Tamaraw protection on Tor — but at latency overhead of 7.32× and bandwidth overhead of 8.06×. This establishes a clear protection–overhead frontier against WTF4Nym (F1=0.39, LO=3.78×, BO=4.22×): halving F1 from 0.39 to 0.06 roughly doubles latency and bandwidth cost.'
