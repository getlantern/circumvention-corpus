abstract: obfsgen is an application-independent tunnel obfuscation tool that trains a generative model on normal traffic and shapes tunneled traffic to match it. Unlike existing application-driven obfuscators, it maintains its own schedule for packet timing and size, sending data proactively and suppressing it on-demand, thereby defeating traffic shape, TLS handshake, and website fingerprinting attacks.
