summary: Under strict per-flow data splits—where all packets from a flow appear exclusively in one subset—NetCoFi outperforms NetMamba by 3.3 Macro-F1 points on packet-level and 4.6 points on flow-level classification on both VPN-app and TLS-120 benchmarks; the paper explicitly notes that packet-level splits allow shared session fields to leak between training and test sets, inflating baseline accuracy estimates.
