defense_implications:
    - Behavioral signatures learned by a censor from one anonymity network cannot reliably be applied to classify traffic from an architecturally distinct network — circumvention tools that combine or mimic multiple dissimilar network architectures gain natural evasion from cross-network classifiers.
    - Decoy-routing or bridge designs that blend traffic profiles from multiple protocol families force censors to maintain per-architecture models, significantly raising their operational cost.
