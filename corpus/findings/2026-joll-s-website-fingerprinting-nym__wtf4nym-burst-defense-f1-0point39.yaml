defense_implications:
    - Tor-specific WF defenses cannot be directly ported to Poisson-rate anonymity networks — continuous cover traffic breaks standard burst-detection state machines and requires architecture-aware variants.
    - Effective WF defense in mixnets requires learning real burst-duration, inter-burst-time, and per-height inter-arrival distributions from the target network's traffic and matching them in generated cover bursts.
