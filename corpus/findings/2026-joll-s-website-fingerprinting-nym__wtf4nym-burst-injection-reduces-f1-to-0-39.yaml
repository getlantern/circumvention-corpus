summary: WTF4Nym, a Nym-tailored burst-injection defense deployed at the entry gateway, reduces Tik-Tok WF F1 score to 0.39 at moderate overhead (latency overhead 3.78×, bandwidth overhead 4.22×). Directly porting Tor's FRONT defense to Nym yields only F1=0.63, and WTF-PAD yields F1=0.87, because both fail to account for Nym's continuous loop cover traffic in their burst-detection state machines.
