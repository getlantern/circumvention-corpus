defense_implications:
    - Server-IP discovery is the primary attack vector against Psiphon-style bridge architectures; tools relying on a fixed or slowly-rotating server pool are vulnerable to this exact technique—bridge churn rate and IP diversity are load-bearing design properties.
    - Domain-fronted or CDN-hosted ingress (meek, domain-fronting) that does not expose a stable server IP is significantly harder to enumerate than direct bridge connections.
