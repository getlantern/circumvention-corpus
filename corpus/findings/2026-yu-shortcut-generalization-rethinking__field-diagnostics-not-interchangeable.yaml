defense_implications:
    - Obfuscating a field with high split sensitivity (e.g., tcp.dstport) may produce misleadingly large test-set accuracy drops without actually degrading a retrained censor classifier—circumvention designers should use retrained-removal experiments to identify which fields are genuinely load-bearing.
    - Field masking evaluations that apply transformations only at test time overestimate how much obfuscating that field actually helps; matched train-test masking is required to assess true resilience against an adaptive censor.
