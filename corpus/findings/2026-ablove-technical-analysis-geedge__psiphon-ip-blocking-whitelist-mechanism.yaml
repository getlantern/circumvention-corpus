defense_implications:
    - Strong protocol obfuscation that eliminates obvious signatures forces censors toward blunt IP-blocking, which causes collateral damage on popular SNIs and incentivizes operators to maintain SNI whitelists—circumvention tools that tunnel over CDN IPs or popular SNIs (domain fronting, meek) exploit this whitelist mechanism.
