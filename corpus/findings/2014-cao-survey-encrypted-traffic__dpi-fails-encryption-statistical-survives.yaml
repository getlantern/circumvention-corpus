defense_implications:
    - Circumvention protocols must defeat not only DPI payload inspection but also flow-level statistical fingerprinting — packet sizes and inter-arrival times remain observable even under encryption.
    - Protocol designers should randomize or normalize observable flow statistics (packet size distributions, inter-arrival times, flow duration) to resist ML classifiers that don't require payload access.
