defense_implications:
    - Congestion-aware routing alone cannot prevent buffer saturation; ad-hoc circumvention protocols operating in memory-constrained environments must implement replica-count ceilings (e.g., Spray-and-Wait style) to keep buffers below capacity.
    - Device buffer size is a first-order constraint on message delivery — protocol designers should profile minimum effective buffer sizes for target device populations before deployment.
