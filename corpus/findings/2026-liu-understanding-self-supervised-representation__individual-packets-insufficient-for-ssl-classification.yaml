summary: 'Packet-level classification without flow context is significantly harder for self-supervised models: on CSTNET packet-level evaluation, shallow learning achieves 63.73% Macro-F1 while AlignTraffic reaches only 24.97%, because individual encrypted-payload packets carry minimal application-identifying information once the initial handshake is excluded.'
