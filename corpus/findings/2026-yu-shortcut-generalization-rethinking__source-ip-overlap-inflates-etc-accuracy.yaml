paper: 2026-yu-shortcut-generalization-rethinking
kind: detection
summary: Increasing Source-IP overlap from 0% to 100% in train-test partitions raises encrypted traffic classification accuracy by approximately 32–33 percentage points before identifier masking (L0 condition), but only about 8 points after masking MAC addresses, IP addresses, and transport ports (L3 condition). This demonstrates that cross-partition identity sharing—not learned traffic patterns—is a primary driver of reported benchmark performance for classifiers like LinearSVC and ET-BERT.
techniques:
