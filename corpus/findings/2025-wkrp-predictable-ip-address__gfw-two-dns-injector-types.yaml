defense_implications:
    - Setting the RD bit in DNS queries (as standard resolvers do) causes both injectors to respond with flags 0x8180, making them indistinguishable by flags alone; circumvention tools probing GFW behavior should use RD=0 to discriminate injector types.
    - The embedded-dot parsing difference provides a secondary oracle to fingerprint injector type without relying on flags.
