defense_implications:
    - Circumvention tools must provide fingerprinting protection by default without requiring user awareness or configuration — most users cannot recognize or reason about fingerprinting threats even if they manage cookies.
    - User education materials should treat browser fingerprinting as conceptually distinct from cookie tracking and not assume privacy-literate cookie users will spontaneously adopt fingerprinting countermeasures.
