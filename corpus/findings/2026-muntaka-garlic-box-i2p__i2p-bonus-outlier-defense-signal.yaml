summary: 'The paper identifies a statistical anomaly defense against I2P reputation injection: an injected bonus value (e.g., 9999) sits orders of magnitude above any legitimate measured value for the same peer, so a router comparing stored bonus fields against the distribution of its own observed measurements for that peer could flag and discard outlier values while leaving legitimately earned reputations intact.'
