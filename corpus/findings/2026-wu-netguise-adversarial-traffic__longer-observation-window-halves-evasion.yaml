defense_implications:
    - Traffic-shaping defenses that morph only the initial handshake or early-window packets are significantly vulnerable to censors that buffer longer flows; extend morphing to cover at least 50–100 packets, or use padding that preserves statistical consistency across the full flow.
    - Prioritize shaping strategies where the morphed traffic distribution is consistent throughout the entire connection, not just the TLS handshake or first-N-packet window.
