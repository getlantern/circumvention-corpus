paper: 2026-wu-netguise-adversarial-traffic
kind: evaluation
summary: 'In a four-round iterative arms-race evaluation where the censor retrains on observed morphed traffic after each round, NetGuise retains 43.5% targeted evasion after round 4 (down from 82.0%), versus 17.8% for the strongest baseline (Amoeba). The censor''s marginal gain per round diminishes: it recovers 19.6 percentage points in round 1 but only 3.3 in round 4, indicating coverage of distributional tails becomes increasingly expensive for the censor.'
