paper: 2014-cao-survey-encrypted-traffic
kind: detection
summary: Supervised and unsupervised machine-learning classifiers (flow-feature vectors, Markov chain fingerprinting) can identify encrypted application traffic — including SSH, Skype, P2P, and VoIP — without access to plaintext payload, achieving practical real-time operation.
techniques:
