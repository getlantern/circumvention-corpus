defense_implications:
    - Spread domain registrations across at least 4-8 independent registrars, certificate authorities, and cloud platforms so no single abuse takedown constitutes a batch burn; concentration under one registrar degrades the effective frontier to near zero even at low mean burn rates.
    - Model each provider as an independent pool when sizing domain inventory; Proposition 4 shows that P independent providers allow tolerating aggregate β > 1 burn rates, so multi-provider diversification is a direct substitute for increasing the raw domain minting rate.
