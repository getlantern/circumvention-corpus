summary: 'Tor''s nested encrypted relay encapsulation effectively defeats byte-level self-supervised classifiers: AlignTraffic achieves only 25.78% Macro-F1 on Tor-tunneled traffic (ISCX-Tor), compared to 83.92% on direct TLS traffic (ISCX-Direct), because Tor''s encrypted cells conceal inner application protocol structure from an observer of the outer connection.'
