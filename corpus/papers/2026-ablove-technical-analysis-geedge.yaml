abstract: The paper analyzes source code from the September 2025 Geedge Networks leak, focusing on the Tiangou Secure Gateway (TSG) firewall used by China, Kazakhstan, Pakistan, Iran, and Myanmar for censorship. The authors reverse-engineered TSG's architecture, protocol parsing capabilities, and blocking rule formats, then extracted fingerprints based on custom random number generators and parsing idiosyncrasies that enable identification of TSG deployments in the Great Firewall and elsewhere. This is the first code analysis of a commercial DPI system deployed in national censorship infrastructure.
