defense_implications:
    - Post-quantum key encapsulation (ML-KEM-1024) can be layered above TLS as an application-protocol extension without replacing the TLS stack, enabling quantum resistance on platforms where the TLS library cannot be patched — a practical upgrade path for circumvention tools already built on TLS.
    - Separating bulk encryption (AES-256) from identity verification (Dilithium challenge-response) allows the two concerns to be upgraded independently as NIST PQC standards evolve, reducing protocol lock-in.
