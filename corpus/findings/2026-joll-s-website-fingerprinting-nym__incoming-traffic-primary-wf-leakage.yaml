defense_implications:
    - Apply cover traffic or rate-shaping to the server-to-client data path, not just client-to-server — asymmetric protection leaves the high-bandwidth response stream fully exposed.
    - Enabling network-requester Poisson rate (λQR=20 ms) cuts WF F1 from 0.87 to 0.64 but at 12.66× latency overhead, indicating a steep infrastructure cost for protecting the inbound channel.
