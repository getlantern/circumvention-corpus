summary: ROA coverage of Tor guard relays grew steadily from 47.20% in January 2021 to 71.43% in May 2024 for IPv4, while IPv6 coverage grew from 19.41% to 43.89% over the same period. Overall ROA coverage for all Tor relays reached 83.51% by May 2024, with more than 90% of observed route announcements for covered prefixes being valid (reaching 92.91% for IPv4 guard relays in May 2024).
