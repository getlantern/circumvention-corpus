defense_implications:
    - Egress-based IP clustering (grouping destinations that share a GFW egress) could amortize TTL probing cost; build an IP-to-egress mapping using traceroute data.
    - Cache TTL calibration results per egress cluster rather than per IP to reduce the number of probes required when connecting to new destinations.
