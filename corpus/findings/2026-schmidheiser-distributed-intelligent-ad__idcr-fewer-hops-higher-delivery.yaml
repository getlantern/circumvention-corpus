summary: Intelligent dynamic clique routing (IDCR) achieves comparable or higher delivery rates than dynamic clique routing while transmitting through up to 25% fewer intermediate hops in protest-like mobility models. In the march mobility pattern with 0.05 MB buffers, IDCR delivered approximately 8% more messages to at least one recipient, 6.5% more to 90% of recipients, and 6.3% more to all recipients compared to dynamic clique routing.
