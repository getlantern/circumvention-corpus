summary: During the blackout, UDP and QUIC were fully blocked; a test of DNS-over-QUIC successfully completed the QUIC handshake but the connection was severed immediately after the first post-handshake data packet, demonstrating that Iran's DPI can pass the QUIC handshake while blocking application-layer data.
