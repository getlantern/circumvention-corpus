abstract: Since early October 2026, Iranian ISPs have begun blocking TCP, UDP, GRE, IPIP, SCTP, and ESP traffic from Iran to international destinations, allowing only ICMP to pass. Measurements from Iran-to-Europe server pairs show a hard ~50k packets/second rate limit (approximately 33 MB/s at 640 B payloads), automatic rerouting to domestic routing when sustained ICMP traffic exceeds ~30 MB/s for several seconds, and asymmetric one-way ICMP echo-request blocks on some Iran IPs that vary day-to-day. Encrypted ClientHello (ECH) defeats SNI-based blocking of Cloudflare connections, achieving 44–82 MB/s throughput.
