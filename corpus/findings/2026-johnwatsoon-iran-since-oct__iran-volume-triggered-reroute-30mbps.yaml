defense_implications:
    - ICMP tunnels must cap per-path throughput below ~27 MB/s; multi-path or multi-server load balancing can aggregate higher bandwidth while keeping each path below the trigger threshold.
    - Build reroute detection into the tunnel (sudden RTT doubling combined with loss spike) and immediately pause or switch exit paths — the degraded domestic route is unusable for circumvention.
