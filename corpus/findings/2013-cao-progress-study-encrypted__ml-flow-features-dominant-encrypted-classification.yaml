defense_implications:
    - Flow-level statistical features (packet sizes, IATs) leak protocol identity even when payload is fully encrypted; circumvention protocols must actively shape or pad traffic to defeat this class of classifier.
    - Avoid any packet-size or timing signature that is consistent across connections—ML classifiers exploit stable per-protocol distributions, so randomization or mimicry of a known benign protocol is necessary.
