defense_implications:
    - Spread domain registrations across at least 4 independent registrars and certificate authorities; with P=4 providers the frontier rises to β* ≈ 1.25 versus 0.65 for a single provider, with no increase in total minting cost.
    - Never concentrate domains under one registrar even for pricing convenience — a single registrar takedown effectively sets burst size b ≫ 1, collapsing the frontier far below what the mean burn rate β alone would predict.
