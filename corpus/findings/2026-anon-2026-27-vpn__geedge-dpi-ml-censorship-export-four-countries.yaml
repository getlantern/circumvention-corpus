defense_implications:
    - The Geedge DPI+ML stack targets encrypted-flow metadata (not payload), meaning payload encryption alone is insufficient; circumvention transports deployed in Geedge-customer countries (KZ, ET, PK, MM) should apply traffic shaping or mimicry to defeat flow-level statistical classifiers.
    - Because Geedge systems support regionally customizable rules, assume that GFW-era detection capabilities (active probing, entropy-based detection, TLS fingerprinting) are now effectively available in non-China censored networks and design transports accordingly.
