summary: Curv-Tail achieves Tail-F1 scores of 85.70% and 46.30% on NUDT-Mobile (300 mobile-app classes) and DataCon-Website (100 encrypted proxy/VPN website classes) under natural long-tailed class frequencies, with only 0.84M parameters and 46.07M MACs per flow—using 98.48% fewer parameters and achieving 10.2× the batch inference throughput of MM4Flow at FP32 precision on an RTX 4090, with an amortized per-flow latency of 0.1359 ms at batch size 256.
