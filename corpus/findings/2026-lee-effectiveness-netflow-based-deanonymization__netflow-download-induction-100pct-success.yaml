defense_implications:
    - Onion service operators cannot rely on Tor alone for IP anonymity against regional ISP-level adversaries; temporal traffic shaping (e.g., constant-rate cover traffic) is the only structural countermeasure against correlation-based deanonymization.
    - Since partial traffic visibility (ingress-only or egress-only) achieves the same 100% success rate, guards alone do not prevent NetFlow-based deanonymization—mitigations must act on the traffic pattern itself, not on relay selection.
