summary: WTF4Nym, a burst-mimicry defense implemented at the Nym gateway that accounts for continuous loop cover traffic when detecting and synthesizing fake bursts, reduces Tik-Tok F1 to 0.39 (closed-world, Testnet) at latency overhead 3.78 and bandwidth overhead 4.22 — compared to 0.65 for FRONT on Tor (LO 2.79, BO 1.84) and 0.87 for Nym's default (Table 7). Time and N-gram leakage drop to 26.6% and 29.0% respectively (Table 8).
