summary: 'Iran implemented a near-complete internet shutdown from June 17–26, 2025 using selective IP-based whitelisting: api.github.com and api.google.com remained accessible while the general internet was blocked. IODA measurements confirmed that ASes 44244 (IranCell) and 57218 (RighTel)—the two largest mobile carriers—were nearly unreachable for the duration.'
