summary: A measurement study of RuStore — Russia's domestic Android marketplace promoted after 2022 sanctions isolated Russian users from Google Play — finds that APKs bundle certificate material and trust-configuration artifacts independently of the OS trust store. The study combines ecosystem-wide measurement with a weighted top-application analysis to characterize how this app-level certificate bundling expands the effective TLS trust boundary.
