defense_implications:
    - A circumvention defense must remain secure even when the adversary can collect many labeled samples of the defended traffic; K=20 augmented-sample evaluation should be a standard stress-test for any randomized defense before deployment.
    - The many-to-many morphing pool can be sourced from arbitrary real-world website traces rather than a fixed pre-configured set, making the defense dataset-agnostic and adaptable across deployments.
