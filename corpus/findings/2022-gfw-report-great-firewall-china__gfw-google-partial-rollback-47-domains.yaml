summary: 'By February 1, 2023, the GFW had rolled back the wildcard *.google.com DNS censorship to a selective list: only 47 of the original 1,147 blocked domains remained censored, including high-sensitivity services (docs.google.com, drive.google.com, accounts.google.com, play.google.com) while lower-sensitivity domains (e.g., translate.google.com) were unblocked. The GFW''s injected DNS responses for google.com use real IP addresses belonging to other tech companies (e.g., 69.63.184.14 belonging to Facebook).'
