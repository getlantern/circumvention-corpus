defense_implications:
    - Encrypting payload bytes is not sufficient to defeat traffic classifiers; circumvention transports must also obfuscate packet-length sequences and direction patterns through padding, splitting, or merging.
    - The classifier attack surface has shifted entirely to behavioral metadata — assumptions that 'encryption defeats DPI' no longer hold against modern ML-based classification.
