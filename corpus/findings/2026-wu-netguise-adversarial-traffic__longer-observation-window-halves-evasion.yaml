summary: Extending a censor's observation window from 30 to 50 packets reduces NetGuise's targeted evasion success from 82.4% to 43.6%, and a 100-packet window reduces it further to 26.1%, while clean Macro-F1 remains high (97.2%–98.8%). Packets beyond the morphed prefix retain source-specific features that are invisible to the morpher, providing an effective and low-cost defense upgrade for censors willing to tolerate slightly delayed classification.
