summary: Clash Verge Rev v2.5.8's merge engine does not recognize `prepend-rule-providers` or `prepend-rules` as valid injection directives; writing a top-level `rules` key in extension YAML replaces the entire rule table rather than prepending to it. The correct extension path requires either the visual rule editor's prepend area or a JavaScript extension script that explicitly splices new entries before `config.rules`.
