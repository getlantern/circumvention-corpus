defense_implications:
    - Circumvention protocols whose flows behaviorally resemble trained service categories will evade confidence-based anomaly rejection; designing flows to sit in the behavioral overlap zone of known services is a viable evasion strategy against this class of classifier.
    - Tor's partial confidence separation (mean 67.66% vs. 81.22% for known services) suggests that onion-routing traffic inherently produces enough behavioral distinctiveness to partially trigger uncertainty-based rejection — a property other protocols could intentionally exploit by injecting timing or size variability.
