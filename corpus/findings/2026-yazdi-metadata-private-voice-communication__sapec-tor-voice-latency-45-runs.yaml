summary: Empirical evaluation of SAPEC across 45 independently circuit-rebuilt Tor runs yielded a median one-way audio delay (OWD) of 355 ms and median RTT of 710 ms (excluding 3 outlier runs). Connection setup time had a mean of 7.43 s and median of 7.61 s, ranging from 3.84 s to 13.48 s. The 3 outlier runs (C9, C24, C30) exhibited OWD means of 1193 ms, 1535 ms, and 2369 ms respectively, attributable to Tor relay selection spanning geographically distant or bandwidth-limited nodes.
