summary: 'DNS answer mismatches between the system resolver and an alternate resolver (e.g., 1.1.1.1) are not by themselves evidence of DNS poisoning: large services use distributed CDN infrastructure and legitimately return different valid addresses. The document cautions against labelling a mismatch as interference without corroborating evidence such as connection failure to the returned address.'
