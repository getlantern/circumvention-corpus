abstract: 'The thread documents an escalation in Iranian DPI capabilities that have begun performing TCP reassembly to extract SNI information, nullifying basic fragmentation-based obfuscation techniques. The original reporter tests multiple circumvention protocols (VLESS/WebSocket, Reality, gRPC, WireGuard, SSH) and documents diverse blocking mechanisms: DNS poisoning to 10.10.34.34, RST floods, IP-list blocking, and behavioral analysis of upload/download traffic ratios. Subsequent observers report synchronized blocking across Iranian networks, with port 443 receiving particularly aggressive inspection. The thread proposes UDP-based protocols (Hysteria), traffic padding, and Snowflake as potential mitigations, highlighting the emerging challenge of stateful DPI that tracks connection state and enforces ''cooling-off'' periods on flagged flows.'
