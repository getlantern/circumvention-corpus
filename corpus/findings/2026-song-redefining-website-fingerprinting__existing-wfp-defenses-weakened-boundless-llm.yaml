defense_implications:
    - Design WFP defenses that do not rely on session-start or page-boundary synchronization — TrafficSliver and FRONT lose significant effectiveness (22% and 7% respectively) when attackers operate on arbitrary stream segments.
    - Padding and shaping schemes should be evaluated in the boundless threat model (continuous stream, no session markers) rather than the traditional page-load model to avoid overstating their protection.
