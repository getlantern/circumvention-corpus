    - generic
defense_implications:
    - Adopt a schedule-driven architecture where the obfuscator drives its own send schedule independently of the application, enabling it to send before or between application writes to shrink apparent burst sizes and tunnel RTT to match normal traffic.
    - Do not add timing jitter to an application-driven obfuscator expecting it to defeat RTT-based fingerprinting; it increases apparent latency and widens the distributional gap.
