summary: 'Apple operating systems showed a severe ECH adoption gap: all 140 accesses from iOS/16.6 and all 56 from iOS/17.7.2 recorded zero ECH successes or GREASE, and most Mac traffic also failed to succeed with ECH except via Firefox. Only a single GREASEd case from iPadOS/18.0 (Mobile Safari/18.0) was observed, suggesting Safari''s ECH support is absent or deeply limited as of mid-2025.'
