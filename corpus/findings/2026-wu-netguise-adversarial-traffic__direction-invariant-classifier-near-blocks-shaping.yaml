summary: A censor classifier restricted to packet-direction sequences only (invariant to both padding and delay injected by a two-ended tunnel) reduces NetGuise's targeted evasion from 82.4% to 2.74%, but at the cost of clean Macro-F1 falling from 97.2% to 41.5%. A padding-invariant classifier (direction + inter-arrival time) yields 42.3% evasion with 62.1% clean accuracy, exposing a fundamental accuracy/robustness trade-off for censors.
