defense_implications:
    - Circumvention tools can embed covert control traffic in LLM-generated text using any commercial API (GPT-4, Claude, etc.) without needing internal model weights or logit distributions — dramatically lowering deployment friction.
    - The seed-only interface means the scheme is forward-compatible with model updates; the carrier generation pipeline does not need to be retrained or recalibrated when the underlying model changes.
