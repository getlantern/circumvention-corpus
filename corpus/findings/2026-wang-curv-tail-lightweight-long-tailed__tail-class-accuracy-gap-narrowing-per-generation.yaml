summary: On NUDT-Mobile, Curv-Tail achieves group-wise Macro-F1 of 96.98% on head classes (top 50% by training frequency), 92.84% on body classes, and 85.70% on tail classes, with per-group gains over the strongest baseline (MM4Flow) of 0.65, 1.12, and 4.97 percentage points respectively—demonstrating that architectural improvements disproportionately benefit rare-class detection and that tail-class accuracy is approaching head-class accuracy.
