summary: MIETT demonstrates that token-level approaches — treating raw hexadecimal byte sequences as tokens — fail to capture flow-level patterns arising from interactions between packets within a flow. The model's Two-Level Attention (TLA) architecture explicitly captures both within-packet byte patterns and cross-packet relationships, and this dual granularity is identified as the critical missing component in prior encrypted traffic classifiers.
