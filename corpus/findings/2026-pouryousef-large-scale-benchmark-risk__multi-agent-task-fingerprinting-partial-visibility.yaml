summary: Multi-agent task fingerprinting achieves up to 90.7% balanced accuracy using all 247 features; observing encrypted traffic from a single agent yields 66.5% accuracy under graph topology and 78.0% under star topology, rising to 84.3% and 85.9% with up to four agents visible. Cross-topology accuracy drops from 83% to 52% but remains well above the 10% chance level, indicating that topology changes reduce but do not eliminate task leakage.
