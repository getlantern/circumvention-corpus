summary: Encrypted DNS (DoH/DoT) reduces the opportunity for in-path DNS query alteration but explicitly cannot remediate IP-level blocks, failed routing, or application-layer restrictions. The document identifies this scope boundary as a common user misconception leading to incomplete diagnosis.
