summary: A linear-programming Matching Selection algorithm pairing ROA-covered clients with ROV-enforcing guard ASes (and vice versa) achieves 48.47% of all client-relay pairs with full ROA+ROV protection using parameters l=0.8, d1=0.9, d2=0.7, B=1.5—a multifold increase over vanilla Tor's base rate. The algorithm is constrained so no relay exceeds θ=5× its vanilla selection probability, bounding guard placement attack risk.
