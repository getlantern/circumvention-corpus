summary: Uncertainty-based rejection (confidence thresholding) provides negligible improvement against behaviorally overlapping unknown services. In I2P, XGBoost rejection recovery is +0.0% Macro-F1; FreeNet known-service mean confidence is 97.75% vs. unknown-service 97.95%, making threshold-based separation impossible. Only Tor exhibits partial confidence separation (known 81.22% vs. unknown 67.66%), enabling XGB recovery of +8.5%.
