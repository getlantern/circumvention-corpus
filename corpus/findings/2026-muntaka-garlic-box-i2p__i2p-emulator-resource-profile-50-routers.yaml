summary: A 50-router I2P deployment spanning five geographic locations stabilizes in approximately 25 minutes and consumes roughly 21 GB RAM (417 MB per router, measured via live systemd cgroups), with a single-host ceiling of approximately 90 routers and a static-profiling estimate (257 MB) that was 62% lower than the live measurement.
