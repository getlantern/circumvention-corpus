summary: The Helol tunnel encodes data in the permutation of TLS CHLO list-type parameters (cipher suites, extensions, elliptic curves, signature hashing algorithms), achieving a median throughput of roughly 8–12 bytes/packet from cipher-suite permutation alone, significantly outperforming SNICat across median and upper quartiles. The per-packet payload from full factorial encoding is ⌊log₂ N!⌋ bits for a list of N elements, yielding ~17–22 bytes/packet at median cipher-suite list lengths observed in local captures.
