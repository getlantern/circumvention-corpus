defenses:
    - tor
defense_implications:
    - Frame circumvention tools around security and safety rather than privacy or personalization — users show acceptance scores ~30% higher for security-framed surveillance than for user-experience-framed surveillance, and this framing effect likely transfers to censorship evasion adoption.
    - Target outreach toward users already exhibiting privacy-protective behaviors (existing tool users), not toward those who merely express privacy concern; behavioral engagement is a far stronger adoption predictor than abstract concern.
