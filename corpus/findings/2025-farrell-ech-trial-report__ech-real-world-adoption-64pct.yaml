summary: In a 42-day production trial across 14 server instances (2025-05-01 to 2025-06-11), 64% of non-bot real-user accesses were from ECH-aware clients (1660 success + 825 GREASE out of 4074 total), versus 36% where ECH was not-tried. The trial found no measurable service disruption from enabling ECH.
