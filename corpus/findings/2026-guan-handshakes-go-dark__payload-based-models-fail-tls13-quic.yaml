summary: Payload-byte-based pre-trained models (ET-BERT) collapse to an average of 45.83% accuracy on CipherSpectrum (TLS 1.3, SNI removed) and 56.25% on VisQUIC, while sequence-based models (FS-Net) maintain 86.40% and 77.87% respectively — confirming that packet length and direction are the dominant discriminative signal once strong payload encryption is applied.
