defense_implications:
    - Constant-rate traffic (Tamaraw/POISS-OFF style) achieves near-perfect WF resistance but is only practical for high-value, low-latency-tolerant use cases (e.g., Tor bridges, not interactive web browsing); design tiered modes so users can opt into constant-rate for sensitive sessions.
    - Mixnet packet overhead (2,413 bytes/cell in Nym vs 514 in Tor) should factor into any cover traffic budget calculation — blanket adoption of Tor-derived constant-rate parameters will produce ~5× the expected bandwidth cost.
