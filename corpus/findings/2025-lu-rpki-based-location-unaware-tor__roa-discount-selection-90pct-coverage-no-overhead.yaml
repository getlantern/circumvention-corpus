defense_implications:
    - Directory authorities can implement BGP-hijack resistance without any client-side changes by publishing a single discount scalar in the hourly consensus; the discount value should be computed from current ROA-covered bandwidth and load factor to avoid overloading ROA-covered relays.
    - Because the algorithm is client-agnostic (ignores client IP/location), it introduces no location side-channel—a strict improvement over location-aware alternatives when anonymity is the priority.
