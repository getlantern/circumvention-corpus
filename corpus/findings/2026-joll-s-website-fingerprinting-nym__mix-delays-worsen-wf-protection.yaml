defense_implications:
    - Per-hop mix delays applied in-network help the WF adversary by temporally separating request and response bursts; they must always be paired with endpoint-side cover traffic to avoid this effect.
    - Circumvention architectures that route packets through multiple independent delay nodes should measure burst separation at the client-gateway link before assuming the delays improve traffic-analysis resistance.
