summary: Classifier-level long-tail corrections applied to a fine-tuned and frozen ET-BERT encoder on NUDT-Mobile—including logit adjustment, effective-number reweighting, class-balanced retraining (cRT), and feature mixup—improve Tail-F1 by at most 0.08 percentage points over the base ET-BERT (82.79%); Curv-Tail's end-to-end joint representation learning outperforms the best correction by 2.83 points in Tail-F1 and 3.05 points in Macro-F1.
