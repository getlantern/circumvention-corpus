defense_implications:
    - Circumvention tools should not treat Iran's firewall as a uniform system — the same domain or IP may be blocked for some users but not others, so per-user probing or adaptive domain selection is more reliable than static configuration.
    - The domain-specific filtering rates (nearly 50% for hrw.org/tiktok.com vs. 0.5% for youtube.com) imply a tiered political sensitivity blocklist; proxies should avoid reusing SNIs of high-sensitivity domains as cover traffic.
