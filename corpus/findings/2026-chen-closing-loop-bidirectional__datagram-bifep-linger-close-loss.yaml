summary: 'For datagram-mode BiFEP (UDP), a configurable linger depth L prevents permanent one-sided close: without linger (L=0), one-sided ACK loss causes the peer that closed first to go silent at epoch 4, making the missing ACK permanently undeliverable and leaving the remote endpoint live indefinitely (e⋆=⊥). With one-bucket linger (L=1), the closing endpoint continues retransmitting FIN+ACK through the next close bucket, resolving all one-sided ACK-loss scenarios in Table VI within epochs 8–12 across all six tested drop counts.'
