summary: 'Incoming (server→proxy) traffic is the dominant leakage channel: Features In achieves 70–72% random-forest accuracy on Testnet vs. 43–44% for Features Out (Table 3). Enabling Poisson-rate cover traffic on the network requester side (λQR = 10–20 ms) reduces the F1 score from 0.87 to 0.75–0.64 but increases latency overhead to 7.32–12.66× (Table 4, configs 10–11), reflecting the anonymity trilemma.'
