summary: In the April 2024 Tor exclusion event, 440 of 7,765 relays were excluded; only 68 (15%) returned with the same fingerprint within one month, while 372 (85%) never returned. Of the 553 relays running to-be-excluded versions one month before the deadline, only 75 updated in time.
