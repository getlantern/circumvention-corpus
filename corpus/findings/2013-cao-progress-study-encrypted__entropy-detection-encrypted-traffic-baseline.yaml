defense_implications:
    - Any circumvention protocol whose wire format is indistinguishable from uniform random bytes will trigger entropy-based detectors; mimicking a known low-entropy protocol (TLS, HTTP) or adding structured framing that reduces measured entropy is necessary.
    - Entropy detection is fast and cheap—assume it runs at line rate on censor infrastructure; defenses that only defeat slower ML classifiers while remaining high-entropy will still be caught.
