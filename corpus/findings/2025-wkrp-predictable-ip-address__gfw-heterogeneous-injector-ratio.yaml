defense_implications:
    - The shared TTL distribution means TTL-based heuristics cannot distinguish cyclic from non-linear injectors; pool membership tests remain the more reliable detection signal.
    - The 1-in-7 non-linear fraction means that any circumvention tool relying on cyclic predictability to detect injection will miss approximately 14% of injected responses routed to non-linear processes.
