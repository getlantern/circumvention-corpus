defense_implications:
    - Train a generative sequence model (e.g., autoregressive or transformer-based) on a representative corpus of the cover protocol's flows; use the model's predicted next-step distribution to schedule real sends, so the resulting flow history matches the cover's learned long-range patterns.
    - Prioritize covering long-range temporal dependencies — not just per-packet size/IAT distributions — since censors using sliding-window or whole-flow features will exploit these correlations even when short-window statistics match.
