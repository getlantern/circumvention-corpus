defense_implications:
    - Circumvention tools should not assume a single injector process; detection logic based on sequence prediction must account for multiple independent counters accessed via hash-routed load balancing.
    - The 4-tuple hash routing means that rotating source ports causes responses to arrive from different injector process instances, complicating any state-tracking evasion strategy.]
