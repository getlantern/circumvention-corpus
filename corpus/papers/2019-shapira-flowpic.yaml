abstract: |
  Classifies encrypted traffic by encoding packet sizes and arrival times as
  images for a convolutional neural network. Evaluates traffic categories and
  application identification using labeled datasets, including VPN and Tor.
notes: |
  Associated talk: https://www.youtube.com/watch?v=sZm7y91v2co
  Expanded journal version: 2021-shapira-flowpic.
  Dataset classification results do not demonstrate deployment by a censor
  or evaluate resistance of REALITY or XTLS Vision.
