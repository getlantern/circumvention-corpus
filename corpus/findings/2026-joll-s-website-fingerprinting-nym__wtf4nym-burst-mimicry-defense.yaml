defense_implications:
    - Burst-shaping defenses applied to mixnet-based proxies must be calibrated against the constant background cover traffic; standard WTF-PAD histograms derived from Tor-scale inter-arrival times (ms vs μs in Nym) will produce oversized fake bursts that are trivially distinguished by deep-learning classifiers.
    - Implement the WTF4Nym finite-state machine at the entry gateway rather than the client, triggering via loop cover packets as covert signalling so the defense activation is itself undetectable.
