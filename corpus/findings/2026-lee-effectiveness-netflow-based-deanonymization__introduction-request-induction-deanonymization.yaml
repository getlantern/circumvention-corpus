paper: 2026-lee-effectiveness-netflow-based-deanonymization
kind: detection
summary: The introduction-inducing attack—sending batches of Tor introduction requests at 15 requests/min without downloading any content—achieves 100% isolated and 98% large-scale deanonymization success, removing the application-specific assumption that the target onion service supports reliable file downloads. High-rate introduction flooding (1,383 req/min) degrades to 13.5–24% success because it activates Tor's puzzle-based DoS defense, which suppresses the induced traffic signal.
