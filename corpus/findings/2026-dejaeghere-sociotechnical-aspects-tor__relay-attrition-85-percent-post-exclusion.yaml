defense_implications:
    - Circumvention networks relying on volunteer relays should assume ~85% permanent attrition after a forced exclusion event; design relay onboarding and geographic-diversity planning around this base rate rather than expecting excluded relays to return.
    - Proactive operator notification 1–2 months before a version deadline materially improves pre-deadline update compliance and reduces permanent relay loss.
