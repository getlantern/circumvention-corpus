defense_implications:
    - Bridges or helper nodes sourced from Iranian academic/institutional IP space are far more likely to have outbound Internet access than residential IPs; partnerships with Iranian academic institutions could provide more reliable relay infrastructure during future shutdowns.
    - 'Do not model Iran''s censorship as a single uniform policy: the coexistence of IP-allowlist and SNI-blocklist layers with inconsistent per-IP application means circumvention tools must handle both layers independently and cannot assume that passing one check means passing all checks.'
