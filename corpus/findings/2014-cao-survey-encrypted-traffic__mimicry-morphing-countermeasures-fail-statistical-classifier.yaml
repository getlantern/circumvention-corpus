summary: 'The survey catalogs the major circumvention countermeasures extant as of 2014: obfsproxy/obfs3 (randomized handshake), StegoTorus (steganographic camouflage), traffic morphing (Wright et al.), SkypeMorph (Tor bridge mimicking Skype), and Format-Transforming Encryption (FTE). It also cites ''Peek-a-boo, I still see you'' (Dyer et al. 2012) and ''The Parrot is Dead'' (Houmansadr et al. 2013) as demonstrating that naive traffic-analysis countermeasures and protocol mimicry approaches fail against statistical classifiers.'
