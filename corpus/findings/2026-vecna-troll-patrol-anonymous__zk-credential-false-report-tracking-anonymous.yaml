kind: defense
summary: Troll Patrol uses zero-knowledge proofs over anonymous credential attributes to track per-user false report counts (f) and pending session state (p) without linking reports across sessions or revealing user identity. A user proves in zero knowledge that f plus any new false reports does not exceed threshold m before submitting; users who exceed m lose reporting ability without any identity disclosure or impact on their reputation within the broader bridge distribution system.
