summary: For a canonical configuration of n=8 endpoints and domain buffer k_max=8, the interval availability frontier sits at β* ≈ 0.65, versus a time-average crossing near β ≈ 0.8. A rotation-only defender operating at β=1.5 achieves (α,T)-availability below 0.25 even at the largest buffer and rotation speed tested, while a domain-aware defender at β=0.6 with the same n, µ, and pool achieves availability above 0.95. The closed-form law (Theorem 1) matches simulation to three significant figures across the full range of β (Table 2).
