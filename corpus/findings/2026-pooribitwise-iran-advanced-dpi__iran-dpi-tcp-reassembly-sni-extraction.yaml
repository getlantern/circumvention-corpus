paper: 2026-pooribitwise-iran-advanced-dpi
kind: detection
summary: Iranian DPI has been upgraded to perform full TCP reassembly to extract SNI from fragmented TLS ClientHellos, defeating client-side fragmentation configured at 10-30 byte first-packet chunks with 10-20ms inter-packet delays. A VLESS+WebSocket setup behind Cloudflare CDN (port 443, randomized path, full-strict mode) using this fragmentation was blocked within 24 hours despite tcpdump-verified correct fragmentation on the client side.
techniques:
