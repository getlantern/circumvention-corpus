defense_implications:
    - Traffic-shaping pluggable transports that can buffer the first 30+ packets before committing padding/delay actions will achieve dramatically higher evasion rates than those forced to act packet-by-packet; design the client-side proxy to collect a short window before releasing the morphed flow.
    - Benchmark any new shaping-based defense under both causal and oracle conditions — a system that looks strong on offline datasets may collapse to near-random under realistic online execution constraints.
