summary: AnyTLS Protocol v2, introduced in the reference implementation (anytls/anytls-go) in April 2025, added cmdSYNACK so the server can report stream-open success or failure before the client's OS TCP timeout fires, along with heartbeat request/response commands and server-settings/version-negotiation frames. Version 0.0.10 clarified cmdFIN behavior; URI support arrived in 0.0.12. sing-box added inbound and outbound support in its 1.12 line.
