abstract: Active measurement study of Iran's allowlist (whitelist) blocking system deployed following the January 2026 nationwide shutdown. Using a privileged vantage point inside Iran, researchers characterize the IP-based filtering rules before and after the May 26 partial restoration, finding that inbound access remains heavily restricted, allowlisted IPs are supplemented by SNI-based filtering for sensitive domains, and blocking policies differ even among allowlisted users.
