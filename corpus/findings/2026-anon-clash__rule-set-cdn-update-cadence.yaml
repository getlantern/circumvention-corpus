defense_implications:
    - CDN-hosted rule distribution (jsDelivr) creates a dependency on CDN reachability from within China; circumvention clients should cache rule sets locally and fall back gracefully when the CDN is unreachable.
    - Surface rule set last-updated timestamps and download health in the client UI — users cannot distinguish 'rule set applied' from 'rule set downloaded successfully' without explicit status reporting.
