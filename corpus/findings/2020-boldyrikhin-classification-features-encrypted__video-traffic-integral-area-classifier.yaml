summary: A correlation-based algorithm achieves sufficient accuracy for classifying encrypted audio and data traffic, but performs poorly on video traffic; an alternative algorithm based on differences in integral areas under traffic intensity curves is required for reliable video classification. This suggests video traffic exhibits distinct non-stationary statistical signatures not captured by simple correlation.
