summary: All tested routing protocols — IDCR, dynamic clique routing, and Epidemic — exhibit a sharp delivery rate drop-off correlated with node buffers reaching maximum capacity, and buffer occupancy increases at similar rates across all three protocols regardless of message hop count. With 0.05 MB node buffers, neither IDCR nor dynamic clique routing achieved 100% delivery in the blockade 2 and several other protest mobility patterns.
