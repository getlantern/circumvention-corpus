summary: 'As of June 2025, Iran blocks GitHub.com and Telegram but leaves the IP address of google.com reachable and Google Drive accessible. This selective blocking pattern created the operational window for Champa: because google.com is reachable, its AMP cache (cdn.ampproject.org) can be reached by fronting on that IP, then used to proxy connections to otherwise-blocked destinations.'
