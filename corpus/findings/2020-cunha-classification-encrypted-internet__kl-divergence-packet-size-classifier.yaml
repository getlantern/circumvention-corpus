summary: Two statistical classifiers based on Kullback-Leibler (KL) divergence and Euclidean distance over flow and packet-size distributions successfully classify encrypted Internet traffic using 'few features,' and their performance is evaluated against a Support Vector Machine (SVM) baseline, demonstrating that lightweight statistical signatures from packet-length distributions alone are sufficient to identify protocol identity.
