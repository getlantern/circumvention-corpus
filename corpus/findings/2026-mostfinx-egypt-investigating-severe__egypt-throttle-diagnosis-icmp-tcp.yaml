defense_implications:
    - Run OONI Probe's throttling measurement module and compare ICMP vs TCP round-trip times under throttled conditions to determine if the mechanism is loss-based or rate-based; the answer determines whether a QUIC or UDP transport could escape the cap.
    - If throttling uses TCP congestion signals, switching circumvention traffic to non-TCP protocols (QUIC, UDP-based) may partially or fully bypass the shaping mechanism.
