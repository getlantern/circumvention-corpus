summary: Iran's DPI blocks domain names that have never had a DNS record published and have not been used as root domains, indicating that SNI-based blocking is triggered by the string in the TLS ClientHello alone — independent of any prior DNS activity or traffic volume — and can fire on previously unused domains within 24 hours of first connection.
