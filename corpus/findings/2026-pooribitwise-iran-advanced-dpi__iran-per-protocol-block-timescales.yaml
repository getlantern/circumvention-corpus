defense_implications:
    - Protocols whose distinctive handshake is visible in the first few packets (Reality, WireGuard) must either eliminate the fingerprint or accept near-instant blocking — QUIC-based or fully-CDN-fronted transports with no fixed handshake may fare better.
    - Server IP burn rate is high for low-traffic protocols; design for rapid IP rotation or unlisted-relay distribution (bridge model) rather than assuming stable endpoints.
