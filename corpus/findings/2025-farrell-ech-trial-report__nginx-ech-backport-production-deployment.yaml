defense_implications:
    - ECH deployment on production nginx is viable today via source backports — the DEfO nginx fork (github.com/defo-project/nginx, release-1.22.1-ech branch) provides a reference build process for operators on Debian stable.
    - ECH split-mode (which would allow Wikimedia content to be fronted via a CDN's IP addresses) remains undeployed due to inability to find a willing CDN partner — circumvention tool designers should investigate this gap as a high-value infrastructure opportunity.
