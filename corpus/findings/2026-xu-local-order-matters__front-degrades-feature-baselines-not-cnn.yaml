defense_implications:
    - FRONT provides >50 pp degradation against classical handcrafted-feature classifiers, so it retains meaningful value against unsophisticated adversaries; circumvention tools need layered defenses that also address sequential/ordering signals to defeat CNN-class attackers.
    - Defense design should jointly target both the count/volume feature space (where FRONT excels) and the temporal ordering signal (where FRONT fails), e.g., by combining dummy injection with real-cell reordering or traffic shaping.
