summary: The minimum observed one-way audio delay of 204 ms across SAPEC's 45-run evaluation represents a structural floor imposed by Tor network architecture; the authors assess no further reduction is achievable without departing from onion routing. Excluding 3 outlier circuits, median OWD was 355 ms, exceeding the ITU-T G.114 recommended 300 ms interactive telephony threshold, yet informal user testing found quality acceptable when privacy is prioritized. At 32 kbps Opus, call quality is described as subjectively equivalent to conventional VoIP under normal Tor circuit conditions.
