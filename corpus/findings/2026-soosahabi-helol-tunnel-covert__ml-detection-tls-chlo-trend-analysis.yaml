defense_implications:
    - A censor deploying ML-based TLS CHLO trend analysis (as flagged by the paper as the most promising countermeasure) would look for statistical deviation from per-host parameter-combination baselines — circumvention tools should match observed local application fingerprints rather than generating uniform random orderings that fall outside the empirical distribution.
    - Pace TLS CHLO emissions near observed real-device rates (~0.48 packets/second per active device from Android telemetry, 0.42/second in lab captures) to avoid rate-anomaly triggers that ML-based NGFWs use as a signal.
