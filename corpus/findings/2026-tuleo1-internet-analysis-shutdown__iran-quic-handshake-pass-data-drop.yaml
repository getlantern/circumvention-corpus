defense_implications:
    - QUIC-based transports (Hysteria 2, etc.) should not assume that a completed handshake implies usable throughput in Iran — the censor can allow the crypto negotiation while blocking data packets; QUIC is not a reliable carrier during Iranian shutdowns.
    - WebRTC-based transports (Snowflake) are similarly blocked during full shutdowns; teams deploying Snowflake or QUIC-based bridges need TCP fallback paths for Iranian users.
