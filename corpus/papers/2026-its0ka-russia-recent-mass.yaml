abstract: On August 4 and September 21, 2026, Russia conducted mass blocking of IP addresses associated with popular VPN/proxy hosting providers including AmneziaHost, FirstByte, Fornex, Play2Go, and Veesp, targeting hundreds to thousands of IPs per provider ASN. The blocking notably affected REALITY proxy servers and AmneziaWG-only infrastructure, suggesting IP-list rather than protocol-detection-based enforcement. A follow-up observation documented selective TCP blocking while UDP/ICMP remained functional to a single VPS across all of Russia, despite minimal traffic volume.
