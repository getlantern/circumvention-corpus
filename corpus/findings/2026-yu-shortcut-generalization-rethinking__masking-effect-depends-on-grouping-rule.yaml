defense_implications:
    - The effectiveness of identifier masking as an evasion strategy is dataset- and split-dependent; circumvention tool designers should not assume that masking IP or port fields neutralizes classification without also controlling for host-level sharing in evaluation.
    - Published ETC accuracy numbers without reported grouping objects and cross-partition overlap statistics are unreliable for adversarial threat modeling—treat them as upper bounds rather than operational estimates.
