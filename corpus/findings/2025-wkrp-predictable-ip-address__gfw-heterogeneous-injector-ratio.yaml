summary: 'Analysis of a June 2025 dataset using DBSCAN clustering confirmed a heterogeneous injector deployment: individual source ports are routed to processes that are either ~100% cyclic or ~100% random-order, with an estimated ratio of approximately 6 cyclic processes to 1 non-linear process. Despite the difference in IP-selection logic, the cyclic and non-linear injectors show virtually identical DNS answer TTL distributions, indicating shared codebase with diverged IP-selection modules rather than entirely separate systems.'
