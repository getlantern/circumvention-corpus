defense_implications:
    - I2P router implementations (and any circumvention transport borrowing I2P-style reputation selection) should add a statistical sanity check on speedBonus and capacityBonus before incorporating them into tier sorting — flagging values that deviate beyond, e.g., 3σ of the peer's own measured performance history.
    - The defense point is the selection layer (cheaper to enforce) rather than the delivery layer, since blocking eligibility of manipulated peers prevents the attack prerequisite shared by the broad class of tunnel-interception attempts.
