summary: Sustaining >~30 MB/s of ICMP traffic for a few seconds triggers automatic domestic rerouting 5–30 s later, raising base RTT from 40 ms to 76 ms and collapsing bulk throughput to ~2 MB/s with 50–90% packet loss for several minutes. Runs held at or below ~27 MB/s never triggered the reroute, pointing to a volume-based reaction rather than a protocol classifier.
techniques:
    - traffic-shape
    - throttling
censors:
