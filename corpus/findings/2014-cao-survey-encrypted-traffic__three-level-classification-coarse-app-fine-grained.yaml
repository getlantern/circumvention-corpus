paper: 2014-cao-survey-encrypted-traffic
kind: evaluation
summary: 'The survey frames encrypted traffic classification as a three-level problem: coarse (encrypted vs. unencrypted), application-level (which app/protocol), and fine-grained (which service within an app, e.g., Skype voice vs. video). Fine-grained classification of encrypted traffic remains an open challenge as of 2014, with host-profiling and flow-correlation methods achieving the best results but requiring sustained observation windows rather than per-packet or per-flow decisions.'
