defense_implications:
    - App-store distribution is no longer reliable for users in Russia or China; circumvention tools targeting these markets must maintain out-of-band distribution channels (direct APK sideload, F-Droid, Telegram bots, web installers) as the primary distribution path rather than a fallback.
    - The 7× year-over-year growth in Russian government takedown requests signals an accelerating enforcement posture; operators should assume any App Store listing in Russia has a short operational horizon and build user communication flows that proactively migrate users before removal occurs.
