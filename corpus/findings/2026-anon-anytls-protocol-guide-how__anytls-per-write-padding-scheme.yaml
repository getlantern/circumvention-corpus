summary: AnyTLS mitigates the recognizable TLS-in-TLS fingerprint by applying configurable packet splitting and padding to early TLS plaintext writes. The default padding scheme covers write indices 0–7 (stop=8), fragmenting authentication and early application writes into size ranges such as 400–500 bytes followed by up to four 500–1000-byte segments for write index 2. Sizes describe TLS plaintext before record encryption overhead, and cmdWaste frames carry filler when application data ends before a planned segment.
