defense_implications:
    - Encrypt the SNI field using Encrypted ClientHello (ECH) to prevent the GFW from matching against its SNI blacklist — the absence of a readable SNI defeats this class of detection entirely.
    - When fronting traffic through a CDN or TLS-mimicking proxy, verify that the outer SNI used is not itself on the GFW blocklist, since even a pass-through SNI triggers RST injection.
