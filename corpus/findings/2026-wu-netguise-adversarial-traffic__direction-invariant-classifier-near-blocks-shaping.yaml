defense_implications:
    - Circumvention tools implementing tunnel-layer padding and delay shaping are vulnerable to censors that classify on packet-direction sequences alone; matching the direction sequence of allowed traffic (not just packet sizes and timings) should be a first-class design requirement.
    - The 41.5% clean-accuracy cost of direction-only classification may deter censors from deploying it at scale, but designers should assume adversarial censors will eventually accept this trade-off for high-value targets — build direction-sequence mimicry into protocols now.
