summary: 'DNS injection for google.com and *.google.com began on September 30, 2022 — eight days after SNI-based blocking — with the GFW injecting forged DNS responses containing incorrect IP addresses. The GFW''s three DNS injectors behave differently: google.com is censored by all three injectors, while *.google.com is censored only by injectors 2 and 3. The injected fake addresses include real IPs belonging to other companies (e.g., 69.63.184.14 belonging to Facebook).'
