defense_implications:
    - Periodic callback timing regularity (beacon interval, FFT periodicity) is the single highest-value ML detection signal for encrypted C2 — circumvention transports using any form of periodic heartbeat or polling must randomize callback timing with substantial jitter to defeat this feature class.
    - Limiting the number of flows per server address or multiplexing within a single long-lived connection reduces the flow-count-per-destination signal that functions as a strong detection artifact in grouped traffic analysis.
