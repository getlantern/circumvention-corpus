defense_implications:
    - Real-time voice over Tor hidden services is feasible with median OWD of 355 ms, but non-deterministic circuit selection produces outliers 2–6× worse; production deployments should implement selective circuit management — measure per-circuit latency and rebuild if above a threshold — rather than accepting Tor's default automatic selection.
    - Connection setup times of 7–8 seconds are acceptable for high-security telephony but would frustrate general users; preemptively building circuits during idle periods can reduce perceived connection latency without compromising anonymity.
