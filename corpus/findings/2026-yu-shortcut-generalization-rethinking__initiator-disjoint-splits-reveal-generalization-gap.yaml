defense_implications:
    - Censor-deployed classifiers trained on non-entity-disjoint splits likely generalize far worse to novel client IPs than published benchmarks suggest—operational evasion may be easier than lab numbers imply, especially against datasets with strong per-host associations.
    - Circumvention evaluation studies should use initiator-disjoint splits to avoid overstating how well classifiers can identify proxy traffic from previously unseen clients.
