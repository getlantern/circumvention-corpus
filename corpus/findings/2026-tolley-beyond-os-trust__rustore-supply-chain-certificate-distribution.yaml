summary: RuStore provides a state-adjacent software supply chain through which APKs containing certificate material can reach Russian Android users at scale, creating a vector for expanding TLS trust anchors outside the OS trust store and outside Google's certificate governance. The 2022 sanctions that drove RuStore adoption also concentrated this distribution power in domestically controlled infrastructure.
