defense_implications:
    - A censor that retrains its classifier with IP fields zeroed or randomized can largely recover accuracy lost to IP obfuscation—IP rotation is not a durable evasion strategy against an adaptive adversary that updates its training pipeline.
    - ET-BERT's larger residual (47.1pp after matched training) suggests that pretrained transformer representations are more sensitive to IP field removal; circumvention tools may achieve stronger evasion against classifiers built on pretrained packet-byte models than against flow-feature or fine-tuned models.
