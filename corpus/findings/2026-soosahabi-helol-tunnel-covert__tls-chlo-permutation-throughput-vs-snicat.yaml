defense_implications:
    - Circumvention protocols can leverage TLS CHLO parameter ordering as a high-bandwidth, low-detectability side-channel for key exchange or bridge distribution — cipher-suite order alone carries ~17 bytes/packet at typical list lengths, requiring no payload modification.
