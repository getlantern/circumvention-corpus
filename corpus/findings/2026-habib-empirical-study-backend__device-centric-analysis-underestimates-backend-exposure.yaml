defense_implications:
    - Circumvention tool threat models must account for server-side data exposure, not only transport-layer visibility; effective privacy tools must protect the user both from network surveillance and from sensitive data landing on state-accessible servers.
    - When evaluating whether a tool protects Pakistani users, map backend ASN and jurisdictional ownership of destination endpoints — app-store or privacy-policy metadata is insufficient.
