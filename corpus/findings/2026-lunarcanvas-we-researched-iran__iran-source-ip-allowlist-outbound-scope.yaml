summary: Before the May 26, 2026 partial restoration, only ~0.017% (~2,000 of 11,766,454 tested Iranian IPv4 addresses) could reach outside the country via Iran's source-IP allowlist; after restoration the figure rose ~4× to ~0.07% (~8,000 IPs), with the majority of newly reachable addresses originating from Noyan Abr Arvan Co. (ASN 202468 and 205585). Successful IPs were sparse within individual /24 subnets, indicating that access is granted to specific IP addresses rather than entire network blocks.
