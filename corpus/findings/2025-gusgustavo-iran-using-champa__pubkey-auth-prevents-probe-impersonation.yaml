defense_implications:
    - Bind server authentication to a long-lived public key embedded in the client configuration string — this defeats simple active-probe impersonation by a censor that intercepts the AMP relay path without also compromising the server's private key.
    - Rotate server public keys and AMP cache endpoints periodically (or when blocking occurs) to recover from server-IP enumeration; the January 2026 update to the issue demonstrates the maintainers already follow this practice.
