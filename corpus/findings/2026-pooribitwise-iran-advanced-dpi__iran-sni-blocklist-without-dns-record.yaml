defense_implications:
    - Do not assume an unconfigured or freshly provisioned domain is safe — Iran's censor extracts and blocklists SNI values regardless of whether the domain resolves or has prior observable traffic.
    - Use per-session ephemeral subdomains or wildcard fronting (if the CDN supports it) to slow domain-level blocklisting, or switch to ECH to structurally hide the SNI.
