defense_implications:
    - Any QUIC- or UDP-based obfuscation protocol that aims for BiFEP-level security must implement an authenticated linger phase (L≥1 additional close bucket) after close readiness to tolerate ACK loss without creating detectable asymmetric connection lifetime.
    - Design the FIN/ACK retransmission to be idempotent and scheduled within the existing cover-traffic budget — not as extra out-of-schedule packets — to avoid introducing a burst fingerprint during connection teardown.
