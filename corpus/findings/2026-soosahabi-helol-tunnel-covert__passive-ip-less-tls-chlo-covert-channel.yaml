defense_implications:
    - For censorship contexts where the censor enforces explicit proxy (no direct TCP connections outbound), a transport that modifies TLS CHLO parameters of passing connections rather than originating new flows is immune to connection-origination controls — this informs designs for pluggable transports operating on shared or institutional networks.
