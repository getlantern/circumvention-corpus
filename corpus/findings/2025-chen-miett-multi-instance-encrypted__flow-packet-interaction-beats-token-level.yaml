defense_implications:
    - Randomizing individual packet payloads (byte-level obfuscation) is insufficient against MIETT-class classifiers; circumvention protocols must also disguise cross-packet interaction patterns including packet count, size sequences, and ordering within a flow.
    - Treat the entire flow — not just individual packets — as the adversarial unit when evaluating detectability of a circumvention protocol.
