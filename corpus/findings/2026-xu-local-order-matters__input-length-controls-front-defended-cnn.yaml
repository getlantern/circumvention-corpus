defense_implications:
    - Defenses that limit the attacker's observable trace length to ~1000 real cells or fewer (e.g., by injecting heavy early padding that forces truncation before real traffic is visible) can push CNN accuracy below classical feature-baseline levels.
    - Transport designs with short circuit lifetimes or frequent rekeying that truncate observable flows may provide incidental WF resistance against sequence-sensitive classifiers, even without explicit padding.
