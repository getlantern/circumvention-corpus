abstract: The thread documents firsthand observations from Iranian internet shutdowns, detailing the censor's blocking techniques and their tactical evolution. During recent blackouts, Iran deployed IP blocking, DPI-based filtering, SNI-based whitelisting with strict packet inspection via NAT filtering, and forced DNS redirection to local providers, progressively countering each circumvention attempt (SNI spoofing, CDN IP routing, DNS tunneling). Contributors discuss limitations of attempted workarounds and explore remaining options including DNS tunneling and satellite internet.
