summary: Diversifying the domain pool across P independent providers (registrars, certificate authorities, hosting platforms) is as important as the raw minting rate. With P=1 provider, correlated takedowns make no β sustainable at b=8 burst size; with P=8 independent providers under the same total minting rate, availability AP = 1 − q^P approaches 1 geometrically and the frontier β* exceeds 1.0 (Figure 5b, 5d, Proposition 4). By contrast, bursty burns with b=4 domains per event (fixed mean β) collapse the single-pool interval frontier from β* = 0.65 to β* = 0.30, and at b=8 no β in [0, 2] is sustainable.
