defense_implications:
    - Any bridge censorship measurement infrastructure should gate active scans behind a prior-indication filter (e.g., user reports, usage-statistics anomalies) rather than periodically scanning all known bridges, to bound scanner exposure risk.
    - Abuse mitigations (e.g., per-credential false-report counters enforced via zero-knowledge proofs) are necessary to prevent adversarial users from triggering unlimited scans and thereby increasing the risk of scanner discovery.
