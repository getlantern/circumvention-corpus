summary: TrafficInstruct evaluates majority-class, random-forest, ET-BERT, an unadapted 27B language model (Qwen3.8-27B), and task-specific LoRA adapters (trained 10 epochs, batch 32, lr 2×10⁻⁵, max 512 tokens) on a shared frozen base across ten traffic classification tasks including VPN detection, Tor behavior detection, and website fingerprinting; task-specific adaptation improves Macro-F1 over the unadapted 27B baseline on all tasks.
