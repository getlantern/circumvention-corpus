summary: Against a blocklisting censor with labeled tunnel traffic, obfsgen's async and sync modes reduce the best-classifier AUC from 0.989–1.000 on plain TLS-tunneling traffic to 0.472–0.581 (async) and 0.453–0.561 (sync), near random chance (0.5), across six classifiers including NB-LL, RF-kFP, Markov chains, CNN-DF, GRU-FSNet, and Transformer-ARES at R=100ms.
