defense_implications:
    - Embed automatic rate-limit detection and exponential backoff into any AMP-cache-based transport; a client that blindly retries after a 302 will exhaust its allowance faster and extend the cooldown period.
    - Surface rate-limit state clearly in the client UI or logs so users understand the session lifecycle and do not mistake a rate-limited session for a network outage.
