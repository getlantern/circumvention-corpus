paper: 2026-lenders-secrets-best-not
kind: detection
summary: DNS over HTTPS traffic is always identifiable by ML classifiers based solely on IP addresses, regardless of encryption strength. Because DoH servers have fixed, well-known IP addresses distinct from data servers, classifiers achieve near-perfect accuracy on DoH without inspecting payload content.
techniques:
    - ml-classifier
    - ip-blocking
    - traffic-shape
censors:
    - generic
defense_implications:
    - Do not route proxy or DNS traffic through fixed, publicly enumerable server IPs; DoH-style deployments are trivially identifiable at the IP layer even when fully encrypted.
    - Proxy DNS resolution must share IP address space (and port) with cover traffic or use CDN fronting to prevent IP-based classification.
