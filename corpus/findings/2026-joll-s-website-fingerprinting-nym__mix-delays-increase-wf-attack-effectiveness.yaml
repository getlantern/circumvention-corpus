defense_implications:
    - Do not rely on per-hop mixing delays as a WF defense; they actively help the WF adversary by separating the two traffic directions. Cover traffic at the endpoints matters far more than delay magnitude.
    - Any protocol that adds asymmetric per-direction delays must apply cover traffic on both client-to-network and network-to-client paths simultaneously, or the burst-separation effect will be exploitable.
