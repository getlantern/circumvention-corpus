summary: Increasing the per-hop mixing delay λM from 0 ms to 100 ms without cover traffic raises Tik-Tok F1 from 0.91 to 0.98 (Table 4, configs 6 vs 5), because larger delays push outgoing and incoming traffic bursts apart in time, making them easier to distinguish and removing confounding packet-order variability. Transposition leakage rises from 88.5% to 95.5% accuracy (Table 5) under the same conditions.
