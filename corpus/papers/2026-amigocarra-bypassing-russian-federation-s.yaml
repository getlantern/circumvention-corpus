abstract: 'An operator of a custom VPN service in Russia documents attempts to circumvent mobile-carrier whitelisting on MTS and other carriers using VLESS+Reality with decoy SNI to popular domains. Testing reveals inconsistent results: the protocol bypasses standard DPI blocking for one user over several weeks, but another user on the same carrier in a different network segment cannot establish connections even once. The thread raises questions about whether whitelist behavior differs between carriers and suggests complete internet blockades may involve mechanisms beyond simple CIDR+SNI filtering.'
