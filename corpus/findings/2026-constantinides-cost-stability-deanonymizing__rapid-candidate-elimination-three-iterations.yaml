summary: Across all 36 stages in the nine end-to-end experiments, the median iteration at which the running intersection shrank to ≤10 candidates was 3, and 64% of stages reached this threshold within 5 iterations. Per-stage candidate sets shrank by 72–87% after the first intersection and by 85–96% by the third iteration, driven by the short (~0.5–1.8s) observation windows that prevent unrelated circuits from injecting persistent false candidates.
