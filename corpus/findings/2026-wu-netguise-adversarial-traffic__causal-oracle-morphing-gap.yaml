paper: 2026-wu-netguise-adversarial-traffic
kind: evaluation
summary: 'Under a realistic history-only causal interface (commit-once, no future packets visible), NetGuise achieves only 33.2% mean targeted evasion success rate on VANT and 5.6% on UTMobileNet, versus 82.0% and 81.8% respectively under the full-window oracle interface. This 49-point gap quantifies the fundamental difficulty that online packet-by-packet execution imposes on traffic morphing: decisions about early packets must be made before later packets in the same flow are known.'
