defense_implications:
    - Censored communities spontaneously develop steganographic naming conventions; circumvention tools could formalize this pattern by providing shared, updateable alias registries for blocked domain names distributed out-of-band.
    - Link-sharing suppression on domestic platforms is a critical discovery bottleneck — circumvention tools should prioritize low-friction sharing mechanisms (QR codes, short codes, offline distribution) that survive platform link-stripping.
