defense_implications:
    - Run at least 8 redundant endpoints to reduce address-denial probability to negligible levels — this is cheap on commodity cloud and shifts all censor pressure to the domain layer where the minting rate is the only lever that matters.
    - Do not trade endpoint count for rotation speed; the geometric bound means each additional endpoint multiplies address resilience independently of per-endpoint rotation rate.
