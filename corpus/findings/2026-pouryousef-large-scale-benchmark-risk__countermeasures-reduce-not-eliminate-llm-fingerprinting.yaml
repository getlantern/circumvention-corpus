summary: Prompt reformulation (wrapping prompts with semantics-preserving instructions) reduces model-fingerprinting accuracy from 93.2% to 69.5% (−23.7 pp), and temperature randomization reduces it by up to 18.2 pp, but accuracy remains far above the 10% random baseline in all tested conditions. Because the attacks exploit correlated signals across packet sizes, timing, burst rates, and response progression simultaneously, the paper concludes that defenses must reshape the entire traffic profile rather than mask any single feature family.
