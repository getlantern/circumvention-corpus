defense_implications:
    - Full BGP-hijack resistance requires both ROA (prefix authorization) and ROV (route filtering at the AS); designing relay selection to co-locate client and guard in mutually ROV-enforcing ASes provides deterministic rather than merely probabilistic hijack protection.
    - Implementing the matching optimization at directory authorities and distributing per-subcategory weight tables to clients (keyed only on client ROA/ROV status, not location) preserves anonymity while enabling stronger routing security.
