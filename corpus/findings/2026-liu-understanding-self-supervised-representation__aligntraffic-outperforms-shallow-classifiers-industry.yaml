defense_implications:
    - Self-supervised classifiers now reliably outperform feature-engineered baselines on direct TLS traffic by large margins, meaning 'look like ordinary HTTPS' obfuscation is increasingly insufficient against ML-equipped adversaries with training data.
    - Industrial evaluation on 165 real-world applications confirms operational deployability beyond academic benchmarks; circumvention tool operators should model adversaries as having access to these techniques, not just DPI signature matching.
