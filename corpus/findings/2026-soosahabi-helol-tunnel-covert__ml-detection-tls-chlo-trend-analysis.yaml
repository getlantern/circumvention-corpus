summary: Static NGFW inspection cannot distinguish Helol tunnel TLS CHLO packets from legitimate privacy-motivated parameter randomization; only advanced statistical or ML monitoring of 'incumbent TLS CHLO trends' could potentially surface anomalies (§5). Local captures across 9 devices over 4 days yielded 96,825 TLS CHLO packets with only 137 distinct parameter-combination fingerprints, illustrating that real traffic is sparse enough for ML baselines to be practical but that the cover population is large.
techniques:
