summary: Introducing hash-based covert carrier filtering does not affect bit error rate (BER) or effective transmission rate (ETR) of the underlying covert channel under packet loss up to 15%, reordering up to 20%, or delays up to 100±50 ms, because the filtering layer only governs carrier selection and leaves embedding and extraction logic unchanged. Results for L=0 and L=6 were statistically indistinguishable across all tested network impairment conditions.
defenses:
