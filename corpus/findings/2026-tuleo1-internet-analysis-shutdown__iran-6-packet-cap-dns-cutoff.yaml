defense_implications:
    - A 6-packet cap rules out any handshake-heavy protocol on non-whitelisted connections; circumvention protocols targeting Iran must either obtain a whitelisted SNI (domain fronting) or establish full session state within 6 packets.
    - DNS-based bootstrapping (DoH, DoT, DNSTT) is unreliable in Iran during shutdowns; Iran-targeted tools need an out-of-band, non-DNS rendezvous mechanism that tolerates sub-minute connection lifetimes.
