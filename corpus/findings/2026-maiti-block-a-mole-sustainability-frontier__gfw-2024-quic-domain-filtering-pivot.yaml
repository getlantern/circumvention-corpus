defense_implications:
    - Treat domain names as the primary exhaustible resource in any QUIC-based moving-target system — QUIC session continuity does not help if the domain is blocked at the Initial packet level before the session migrates.
    - Prefer free-tier platform sub-domains (collateral-protected, near-zero cost) over self-owned registrable domains wherever possible, since the censor can block registrable domains persistently at essentially zero collateral cost.
