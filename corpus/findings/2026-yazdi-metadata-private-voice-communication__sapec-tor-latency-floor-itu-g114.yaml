defense_implications:
    - Tor-routed voice will structurally exceed the ITU-T G.114 300 ms latency recommendation for most circuits; designers should set user expectations accordingly and use codecs (Opus at 32 kbps recommended) that maintain acceptable quality at these delays rather than optimizing the cryptographic overhead.
    - The 204 ms OWD floor suggests that relay selection quality dominates latency far more than protocol-level overhead; circuit quality monitoring with proactive rebuild-on-high-latency logic will yield larger user-experience improvements than any cryptographic or signaling optimization.
