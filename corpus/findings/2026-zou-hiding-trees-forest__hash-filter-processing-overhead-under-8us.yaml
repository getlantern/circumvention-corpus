summary: 'Per-packet processing overhead for SHA-256-based covert carrier filtering remains below 8 µs across all tested filter key sizes (L=1–8): storage channels (709-byte average payload) take 5.7–6.48 µs; timing channels (1146-byte average payload) take 7.44–7.87 µs, measured on a 12th-gen Intel Core i5-12400 at 2.50 GHz. This overhead does not cause packet loss or measurable end-to-end latency increase.'
