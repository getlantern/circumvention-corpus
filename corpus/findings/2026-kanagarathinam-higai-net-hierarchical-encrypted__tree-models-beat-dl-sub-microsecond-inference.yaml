defense_implications:
    - Defenders cannot assume that adversarial classifiers require expensive deep-learning infrastructure; lightweight gradient-boosted trees running below 1 µs/packet are sufficient for inline per-flow GenAI identification at network speed.
    - The dominance of hand-crafted DL/UL ratio features over raw-sequence models means that obfuscating statistical byte-ratio summaries—not just raw packet sequences—is necessary to evade this class of classifier.
