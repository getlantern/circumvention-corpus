defense_implications:
    - GFW censorship of a domain is not permanent; circumvention tools should maintain live reachability checks rather than static blocked-domain lists, as enforcement scope can shrink or expand.
    - GFW DNS injection with real third-party IPs (rather than known bogon addresses) means naive detection based on RFC1918 or known-bogon checks will miss injected responses; detectors must validate that returned IPs actually serve the expected TLS certificate.
