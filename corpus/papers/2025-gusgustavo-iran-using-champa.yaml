abstract: Operational thread documenting how to use Champa, an AMP-cache-based circumvention proxy, to access blocked services in Iran. Champa tunnels connections through Google's AMP cache by routing via the reachable google.com IP address, achieving ~15 KB/s throughput before AMP rate-limiting kicks in. Thread documents Iran's blocking of GitHub.com and Telegram while Google Drive remains accessible, and provides practical setup instructions and troubleshooting for Iranian users.
