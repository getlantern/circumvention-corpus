summary: 'In Nym''s default configuration, the incoming (server-to-proxy) traffic direction is the dominant WF leakage source: Features In leaks 72.1% classifier accuracy on Testnet versus 43.9% for outgoing traffic (Features Out). The root cause is that Nym''s network requester forwards web server responses at full rate without Poisson-rate smoothing, leaving identifiable burst patterns visible at the observation point between client and gateway.'
