abstract: Researchers at UC Santa Cruz conducted active measurements of Iran's IP-based allowlist system from a vantage point within Iran using spoofed GRE tunnels, studying blocking policies before and after the May 26, 2026 partial internet restoration. The study reveals that while the allowlist expanded after restoration, inbound access to Iran remains heavily restricted (only 2.8% of tested global /24 networks could reach the Iranian VP). SNI filtering persists as a secondary enforcement layer, with TCP RSTs triggered for sensitive domains even for allowlisted IPs, indicating differentiated multi-layer blocking.
