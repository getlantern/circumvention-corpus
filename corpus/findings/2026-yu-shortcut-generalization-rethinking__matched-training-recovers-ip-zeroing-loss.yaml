summary: For state-of-the-art pretrained models YaTC and NetMamba, test-only IP zeroing causes an 11–13 Macro-F1 point loss, but applying the same zeroing transformation during both training and testing (matched preprocessing) recovers performance to approximately the original level (residual gap ≈0). ET-BERT retains a 47.1-point residual gap after matched zeroing on CSTNET-TLS 1.3, indicating genuine information loss beyond representation mismatch.
