defense_implications:
    - Random ±byte perturbations per extended-manifest download eliminate the need for manual HTTP/2 header accounting; this is simpler and more robust than exact header calculation.
    - Dodge-style defenses are viable for HTTP/3-QUIC deployments without redesign — a concrete counter to the concern that QUIC's adoption would outpace video fingerprinting defenses.
