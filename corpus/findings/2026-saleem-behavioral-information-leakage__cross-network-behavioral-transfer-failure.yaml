kind: detection
summary: 'A leave-one-network-out evaluation shows that behavioral classifiers trained on three anonymity networks (Tor, I2P, FreeNet, ZeroNet) fail to generalize to the held-out network, with all Macro-F1 scores remaining below 0.1822 regardless of whether structural, rhythmic, or combined descriptors are used. The highest individual result (Rhythmic, Tor held out: 0.1822) is still far below intra-network performance. This demonstrates that behavioral leakage signatures are architecture-specific rather than universal.'
