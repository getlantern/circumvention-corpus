defense_implications:
    - The low hardware cost and operational overhead of NetFlow-based deanonymization mean the threat is not limited to intelligence agencies; any well-resourced ISP operator is a realistic adversary, so circumvention tool threat models should include regional and commercial ISPs, not only nation-state signals-intelligence units.
    - Because the data-collection infrastructure is already deployed in most ISP networks (standard NetFlow for traffic engineering), no additional attacker-side deployment is needed; circumvention tools cannot detect or disrupt the monitoring itself.
