defense_implications:
    - WF defenses must be re-engineered for the specific cover-traffic architecture of the underlying transport; direct ports of Tor-era defenses to non-Tor anonymity networks yield poor results because burst-detection state machines break under continuous cover traffic.
    - Burst-injection at the gateway/relay level (WTF4Nym pattern) achieves a better protection/overhead tradeoff than tuning the mixnet's own parameters; circumvention tools using relay-based transports should implement relay-side WF defenses.
