summary: Using only encrypted packet metadata — packet sizes, directions, timing, and burst structure — a passive on-path observer achieves 97.7% balanced accuracy fingerprinting 10 LLMs, dropping only to 92.2% when the candidate set scales to 20 models. Two post-trained variants sharing the same Qwen3-14B backbone remain separable at 100% and 96.7% recall, showing that post-training-induced behavior changes the traffic fingerprint independently of architecture.
