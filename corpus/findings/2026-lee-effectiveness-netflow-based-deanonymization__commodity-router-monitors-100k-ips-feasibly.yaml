paper: 2026-lee-effectiveness-netflow-based-deanonymization
kind: evaluation
summary: A Juniper MX204 router ($40,350, released 2017) can monitor 100,000 active IP addresses simultaneously with J-Flow (Juniper's NetFlow/IPFIX implementation) at 1:1,000 sampling during 636,000-pps realistic traffic, with zero packet drops, zero monitoring errors, a maximum relative error of 0.05%, and CPU/memory utilization indistinguishable from baseline. Storing the resulting telemetry requires only ≈516 MB/day (15.6 GB/month), well within commodity ISP capacity.
techniques:
