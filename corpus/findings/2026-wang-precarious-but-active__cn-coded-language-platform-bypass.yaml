summary: 'Fans in Chinese transformative fandom developed systematic coded language to reference banned platforms and circumvent link blocking: AO3 was referred to as ''the red and white website whose name cannot be mentioned,'' direct URLs were converted to text passwords posted in comments, and fan communities used numeric codes (e.g., ''123456'') to identify celebrity pairings in ways opaque to platform keyword filters. These community-maintained encoding conventions were required knowledge for platform access.'
