paper: 2026-liu-routerweave-unified-observation
kind: detection
summary: Combining L3/L4 behavioral traffic statistics with passively visible service-context metadata (DNS queries, TLS handshake fields, local service-discovery) via feature-wise linear modulation (FiLM) raises application recognition accuracy from 76.16% (traffic-only) and 89.93% (service-context-only) to 94.76% combined. During media-buffering periods where payload traffic is quiescent, traffic-only accuracy collapses to 60.32% while joint recognition reaches 96.83%; for flows sharing CDN endpoints across activity types, service-only accuracy is 92.42% but joint reaches 99.40%.
