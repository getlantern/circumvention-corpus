defense_implications:
    - Russia is deploying second-order VPN detection at the application layer (domestic platforms blocking VPN-origin IPs), meaning circumvention tools targeting Russian users need IP addresses that are not classified as VPN/proxy ranges by commercial IP reputation services.
    - The combination of infrastructure blocking and domestic platform VPN-detection creates a layered censorship environment; split-tunneling strategies that route domestic Russian services natively (not through the tunnel) may be required to maintain usability.
