defense_implications:
    - Withholding model details or using a generic API gateway does not prevent passive identification of specific serving variants — post-training and fine-tuning produce independently fingerprintable traffic signatures.
    - Fingerprint-resistant serving requires altering response streaming and chunk packetization behavior, not just network-layer obfuscation.
