defense_implications:
    - Exploiting the censor's dilemma — forcing unacceptable false-positive rates on legitimate traffic — is a first-class design goal alongside minimizing true-positive detection; tools should measure FPR cost imposed on the censor, not only their own evasion success rate.
    - A defense that is imperfectly detected but forces 25% collateral FPR may be operationally more durable than one achieving perfect evasion only against weaker classifiers while remaining cleanly separable by stronger ones.
