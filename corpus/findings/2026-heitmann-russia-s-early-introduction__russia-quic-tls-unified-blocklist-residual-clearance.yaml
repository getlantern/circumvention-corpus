defense_implications:
    - Domain selection cannot serve as a QUIC evasion strategy in Russia; any domain blocked over TLS is blocked over QUIC, so circumvention tools must conceal the SNI rather than choose an unblocked domain.
    - The residual-clearance property for select domains (including wirevpn.app, nordpass.com) suggests that pre-seeding the 4-tuple with benign uncensored traffic before initiating a censored QUIC connection may temporarily bypass blocking—worth testing as a short-term evasion mechanism.
