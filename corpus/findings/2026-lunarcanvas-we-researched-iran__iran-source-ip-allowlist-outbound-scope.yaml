defense_implications:
    - Circumvention proxies hosted on Iranian IP space face near-certain blocking unless the hosting AS is explicitly allowlisted; prefer proxy infrastructure in ASes with confirmed allowlist status (e.g., Noyan Abr Arvan co. post-restoration).
    - Do not assume /24-level granularity when predicting which Iranian IPs can reach out; the allowlist operates at the individual IP level, so /24-based IP reputation scoring will over-predict reachability.
