defense_implications:
    - Onion services used as circumvention infrastructure should apply (or advocate for upstream adoption of) the short-lived internal introduction circuit mechanism described in §5 — the fix requires no change to the public descriptor and is backward-compatible with existing clients.
    - 'The mitigation''s strength is bounded by rendezvous circuit anonymity: if rendezvous circuits (~10 min) are themselves vulnerable to intersection attacks, reducing introduction circuit lifetime provides only marginal benefit, so circumvention tools should evaluate both circuit types.'
