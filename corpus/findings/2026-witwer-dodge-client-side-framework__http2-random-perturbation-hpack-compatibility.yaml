summary: Small random per-session perturbations (±bytes per range) to Dodge-mimic extended manifests fully compensate for HPACK header compression in HTTP/2, yielding vRF accuracy of 10.5–14.2% for k=10 — indistinguishable from HTTP/1.1 results and near the theoretical bound. Because HTTP/3-QUIC uses analogous QPACK compression, the approach generalizes to the dominant future transport.
