defense_implications:
    - Circumvention protocols that randomize traffic patterns but leak DNS queries or TLS SNI remain highly classifiable; SNI encryption (ECH) and encrypted DNS (DoH/DoT) are load-bearing requirements, not optional hardening
    - The reliability-weighted FiLM fusion degrades gracefully when only one evidence channel is available—defeating a classifier requires simultaneously neutralizing both traffic-shape and service-context signals, not just one
