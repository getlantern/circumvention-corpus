summary: Adding nine beacon descriptors (inter-arrival-time moments, FFT peak period and power, flow count per endpoint triple, idle ratio) to the flow-statistics view improves Random Forest F1 from 0.747 to 0.856 (+0.109) — one order of magnitude larger than any multi-view fusion gain (+0.022). However, the top-weighted feature beacon_n_flows correlates with capture length (Spearman ρ = 0.718) and its single-feature ROC-AUC varies from 0.173 to 0.977 across folds, indicating it partly reflects a collection artifact rather than real beacon periodicity.
