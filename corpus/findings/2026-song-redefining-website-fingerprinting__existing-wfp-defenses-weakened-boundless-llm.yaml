summary: In the boundless (boundary-free, session-unsegmented) setting with Human+Claude training, TrafficSliver reduces WFNet accuracy from 0.760 to 0.592, Cluster Anonymization (Palette) to 0.647, and Zero-delay (FRONT) to 0.706 at 2000 training samples. All three defenses assume clean session or page-load boundaries and are less effective against an attacker classifying arbitrary 5,000-packet continuous segments.
