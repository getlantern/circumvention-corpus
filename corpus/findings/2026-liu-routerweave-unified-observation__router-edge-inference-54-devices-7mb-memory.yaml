paper: 2026-liu-routerweave-unified-observation
kind: evaluation
summary: A commodity home router (GL-MT3000, 512 MB RAM) running RouterWeave can support 54 concurrent monitored devices within a 5-second update window using at most 150 MB total process memory and 4.8 s P95 processing time, more than twice the average US household size of 21 connected devices. RouterWeave maintains per-device model footprints of 1.68–2.50 MB and peak RSS of 5.41–6.99 MB per task, establishing that adversarial encrypted-traffic classification is deployable at the network edge without server-class infrastructure or cloud offload.
