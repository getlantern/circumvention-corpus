defense_implications:
    - Running n ≥ 7 parallel endpoints is sufficient to neutralize address-level blocking even against an aggressive censor; additional redundancy beyond this threshold yields diminishing returns and engineering budget is better spent on the domain economy.
    - 'The collateral constraint on hyperscaler IP blocking (γ < 1) is a structural property to exploit: deploy across providers whose IP ranges carry domestic economic load to ensure censors face non-trivial collateral costs.'
