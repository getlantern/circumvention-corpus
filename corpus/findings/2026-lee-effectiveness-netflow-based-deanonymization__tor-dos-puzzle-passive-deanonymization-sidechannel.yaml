paper: 2026-lee-effectiveness-netflow-based-deanonymization
kind: detection
summary: 'Tor''s puzzle-based DoS defense exposes a globally visible side channel: public puzzle difficulty values correlate with onion service load changes, enabling a fully passive deanonymization attack that sends zero traffic to the target. An adversary with access to large-scale NetFlow telemetry can semantically match puzzle-difficulty traces against traffic-volume traces from candidate IPs to locate the onion service''s hosting IP without any active interaction, making the attack applicable to multiple Onions of Interest simultaneously over long observation windows (months to years).'
