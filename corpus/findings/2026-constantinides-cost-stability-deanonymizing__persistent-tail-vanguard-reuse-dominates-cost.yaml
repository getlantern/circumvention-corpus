defense_implications:
    - Persistent guard and vanguard reuse — Tor's own path-stability mechanisms — inadvertently create recurring traffic patterns that act as fixed beacons, enabling sequential deanonymization; circumvention designs that rotate relay assignments more frequently would disrupt this.
    - Adding cover traffic between observation windows (e.g., sending application-layer pings through unrelated circuits) would force false candidates to persist across more iterations, increasing attacker effort proportionally.
