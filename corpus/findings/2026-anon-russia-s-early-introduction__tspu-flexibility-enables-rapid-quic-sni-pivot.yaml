defense_implications:
    - QUICv2 (RFC 9369) is not blocked by Russian TSPU devices as of April 2026 and represents the highest-confidence current bypass; circumvention tools using QUIC transport should default to QUICv2 for Russian users.
    - Non-port-443 destination ports do not reliably evade TSPU QUIC censorship outside a subset of Moscow system ports; avoid relying on obscure ports as a primary evasion strategy in Russia.
