summary: Epidemic routing achieves higher delivery rates than IDCR but at a cost of up to 62× more message hops in protest-specific mobility patterns and up to two orders of magnitude more message-related packets (e.g., 27.8 million packets vs. 571,114 for IDCR in the gather pattern with 0.05 MB buffers). Both prior works and this evaluation confirm that Epidemic-class flooding is impractical for resource-constrained devices in real protest deployments.
