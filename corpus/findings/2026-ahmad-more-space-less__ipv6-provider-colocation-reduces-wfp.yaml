defense_implications:
    - Selecting a CDN or hosting provider with aggressive IPv6 address sharing (Cloudflare, Google) as a proxy front inherently degrades IP fingerprinting accuracy for any individual destination co-hosted on that infrastructure.
    - When evaluating CDN-fronted transports, prefer providers with high domain co-location density in IPv6—this structural property reduces fingerprintability of the circumvention destination without any active defense.
