summary: AlignTraffic, a cross-view contrastive self-supervised model, outperforms shallow classifiers by 5.97 to 30.70 Macro-F1 percentage points across four public encrypted-traffic classification tasks after fine-tuning, and achieves 94.54% accuracy and 51.26% Macro-F1 on an industrial dataset of 165 applications comprising ~4.2 million samples collected March 2025–March 2026, with geographic transfer to held-out regions (Beijing, Xi'an) showing 4.74 pp improvement over the industrial baseline without retraining.
