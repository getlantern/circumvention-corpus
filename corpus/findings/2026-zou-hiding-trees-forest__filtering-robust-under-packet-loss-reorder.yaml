defense_implications:
    - Carrier-selection filtering can be layered onto any existing covert channel implementation without degrading its robustness characteristics — it is a drop-in covertness enhancement rather than an architecture change.
    - For timing covert channels operating over lossy links, the aperiodic pseudo-random modulation produced by filtering additionally prevents regularity-based and autocorrelation-based detectors from flagging the channel, providing a dual benefit beyond pure packet-loss tolerance.
