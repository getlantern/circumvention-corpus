summary: SAPEC augments the standard TLS handshake with a custom protocol layer that performs ML-KEM-1024 post-quantum key establishment and derives AES-256 symmetric session keys, then performs mutual CRYSTALS-Dilithium identity verification before any audio is transmitted. TLS is explicitly treated as an untrusted intermediate step because its asymmetric primitives are not quantum-resistant; the ML-KEM layer operates above TLS to protect against harvest-now, decrypt-later attacks by a quantum-capable adversary.
