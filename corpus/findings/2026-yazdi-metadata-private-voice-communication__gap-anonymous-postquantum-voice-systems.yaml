defense_implications:
    - Tor hidden services are the only deployed transport that conceals both parties' IP addresses from each other and from intermediaries; circumvention voice tools targeting high-risk users (journalists, activists) should route signaling and media exclusively through hidden services rather than through centralized signaling infrastructure.
    - Integrating ML-KEM into the application handshake above TLS is a deployable path to quantum resistance today that does not require waiting for TLS libraries to natively adopt FIPS 203.
