summary: obfsgen claims to defeat traffic-shape, TLS handshake fingerprinting, and website fingerprinting attacks simultaneously through its schedule-driven architecture. The system sends data proactively and suppresses it on-demand, decoupling the observable traffic shape from both the application's send pattern and the destination website's fingerprint.
