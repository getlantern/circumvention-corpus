summary: RouterWeave achieves 94.41% macro-F1 for application activity recognition (browsing, streaming, music, video across Android, iOS, Windows) and 97.46% macro-F1 for IoT operations from encrypted network traffic alone, running natively on a commodity home router (GL-MT3000) with under 7 MB of memory per task and P95 application prediction latency of 41.08 ms. This establishes that ML-based traffic analysis can identify application-layer activities without payload decryption at network-edge hardware constraints, outperforming baselines by up to 20.99 percentage points.
