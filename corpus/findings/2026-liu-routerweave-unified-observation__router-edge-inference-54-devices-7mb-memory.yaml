defense_implications:
    - Circumvention tool designers should model the adversary as having router-edge ML classification capability at ISP CPE or home-gateway hardware—not only datacenter DPI—which removes cost and latency as barriers to per-flow inference
    - The 5-second update granularity of router-side inference sets a practical minimum for how quickly a circumvention transport must shift its traffic signature to evade online classifiers; adaptive polymorphic schedules should change profile faster than this window
