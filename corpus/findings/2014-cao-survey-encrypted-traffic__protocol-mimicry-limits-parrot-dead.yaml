defense_implications:
    - Surface-level mimicry of a protocol (copying header fields, rough packet-size distribution) is insufficient; cryptographically enforced format-transformation (FTE) or tunneling inside a real implementation of the cover protocol is required.
    - 'Designers should treat flow-level distinguishability as a first-class threat model: run a trained ML classifier against their own transport traffic and measure false-negative rate before deployment.'
