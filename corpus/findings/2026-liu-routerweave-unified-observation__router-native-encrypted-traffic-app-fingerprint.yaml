defense_implications:
    - Circumvention transports cannot rely solely on payload encryption; traffic pattern obfuscation (packet sizing, inter-arrival timing, flow multiplicity) is a first-order requirement even on consumer-grade router hardware
    - Any proxy or tunnel that runs on a user's home network is observable at the gateway level—protocol designers should assume adversarial traffic classification capability at ISP or home-router granularity, not just at backbone DPI boxes
