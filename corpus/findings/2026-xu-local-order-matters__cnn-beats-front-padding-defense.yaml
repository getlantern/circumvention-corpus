defense_implications:
    - FRONT-style padding alone is insufficient against sequence-aware CNN classifiers; a WF-resistant transport must also destroy the local ordering of cells, not merely inflate direction counts and volumes.
    - Even lightweight, CPU-only adversaries can break FRONT — a circumvention tool relying on Tor should not treat FRONT as a sufficient WF countermeasure.
