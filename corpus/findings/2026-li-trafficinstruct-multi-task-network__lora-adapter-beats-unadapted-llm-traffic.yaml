defense_implications:
    - LLM-based classifiers with parameter-efficient fine-tuning (LoRA) achieve competitive performance on encrypted circumvention traffic detection without requiring custom feature engineering — the barrier to deploying sophisticated classifiers is now primarily data collection, not model development.
    - The 55,000-record benchmark with fixed session-disjoint splits provides a reproducible evaluation framework; circumvention protocol designers should test against this benchmark to quantify detectability before deployment.
