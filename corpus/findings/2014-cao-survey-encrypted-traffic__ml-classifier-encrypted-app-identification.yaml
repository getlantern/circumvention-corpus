defense_implications:
    - Flow-level ML classifiers are a credible threat even against fully encrypted transports; defense requires shaping the packet-size and timing distribution to match a benign cover protocol, not just encrypting content.
    - Markov chain fingerprinting (Korczynski & Duda, INFOCOM 2014) can expose stateful protocol patterns even in encrypted streams — transports should inject deliberate noise into state-transition sequences.
