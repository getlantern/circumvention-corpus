defense_implications:
    - Censors benefit primarily from capturing and analyzing the initial handshake packets; circumvention protocols that delay or suppress application-identifying plaintext until after connection establishment reduce the early-decision window available to flow classifiers.
    - Per-packet classification without handshake context is unreliable for ML models (~25% Macro-F1) but explicit protocol feature extractors remain effective (~64%); protocols must eliminate both handshake plaintext and observable TLS record-header structure to defeat both classifier families.
