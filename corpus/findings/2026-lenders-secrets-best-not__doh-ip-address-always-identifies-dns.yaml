defense_implications:
    - Avoid relying on DoH for DNS traffic obfuscation in any deployment where the DNS resolver's IP is distinguishable from other endpoints — consider routing DNS over the same server IP as application data (single-server topology D1/P1).
    - For censorship-circumvention proxies that forward DNS, co-locating the DNS resolver on the same IP/port as the proxy data channel eliminates IP-based DNS identification.
