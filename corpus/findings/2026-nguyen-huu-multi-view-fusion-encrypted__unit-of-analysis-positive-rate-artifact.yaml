summary: 'The apparent 55.1% positive rate in a 17,577-flow Cobalt Strike corpus is an artifact of counting individual flows rather than endpoints: those flows reduce to only 2,132 independent endpoint groups, where the true positive rate is 4.2%. No endpoint triple carries a mixed label, so flows sharing a destination are not independent observations and standard deviations computed at flow level are artificially small.'
