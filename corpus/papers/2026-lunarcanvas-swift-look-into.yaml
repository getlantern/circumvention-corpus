abstract: This ongoing measurement study documents Iran's IP-based allowlist blocking system before and after the May 26, 2026 partial Internet restoration, using a vantage point within Iran. The researchers measure the allowlist's expansion, continued SNI-based filtering even for allowlisted IPs, and severe restrictions on inbound access. Active measurement and IP spoofing techniques reveal rapidly evolving blocking policies at both the IP and application layers.
